<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>FILLCO Production Planner</title>
<style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style>
<style>
:root{
  --bg:#eef0ec;
  --surface:#ffffff;
  --surface-2:#e2e6de;
  --border:#cfd5c9;
  --text:#1b241f;
  --text-mute:#5d675c;
  --accent:#286873;
  --accent-2:#3f8f88;
  --accent-soft:#dbe9e7;
  --good:#2f8f5b;
  --good-soft:#dcefe3;
  --warn:#b9791b;
  --warn-soft:#f5e8d3;
  --bad:#bf4c37;
  --bad-soft:#f6ded8;
  --shadow: 0 1px 2px rgba(20,30,25,.06), 0 4px 14px rgba(20,30,25,.05);
  --radius: 10px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#141917;
    --surface:#1b211e;
    --surface-2:#242b27;
    --border:#333c37;
    --text:#e9ede8;
    --text-mute:#9aa69c;
    --accent:#6fc2c9;
    --accent-2:#4fa79f;
    --accent-soft:#203230;
    --good:#6fcf97;
    --good-soft:#1c2e24;
    --warn:#e0ad57;
    --warn-soft:#332a17;
    --bad:#e58a76;
    --bad-soft:#332019;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 4px 18px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  --bg:#141917;
  --surface:#1b211e;
  --surface-2:#242b27;
  --border:#333c37;
  --text:#e9ede8;
  --text-mute:#9aa69c;
  --accent:#6fc2c9;
  --accent-2:#4fa79f;
  --accent-soft:#203230;
  --good:#6fcf97;
  --good-soft:#1c2e24;
  --warn:#e0ad57;
  --warn-soft:#332a17;
  --bad:#e58a76;
  --bad-soft:#332019;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 4px 18px rgba(0,0,0,.35);
}
*{box-sizing:border-box;}
body{
  background:var(--bg);
  color:var(--text);
  font-family:"IBM Plex Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  padding-inline:16px;
  padding-block:14px 40px;
}
.mono{ font-family:"IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace; font-variant-numeric:tabular-nums; }
h1,h2,h3{ font-family:"IBM Plex Sans", sans-serif; text-wrap:balance; margin:0; }
a{ color:var(--accent); }
.shell{ max-width:1180px; margin:0 auto; }

/* header */
.topbar{ display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; margin-bottom:14px; }
.brand{ display:flex; align-items:center; gap:10px; }
.brand-mark{ height:30px; display:flex; align-items:center; flex:none; background:#fff; border-radius:6px; padding:3px 6px; }
.brand-mark img{ height:100%; width:auto; display:block; }
.brand h1{ font-size:17px; font-weight:700; letter-spacing:-.01em; }
.brand .sub{ font-size:11.5px; color:var(--text-mute); margin-top:1px; }
.sync{ font-size:11.5px; color:var(--text-mute); display:flex; align-items:center; gap:6px; appearance:none; border:1px solid transparent; background:none; border-radius:6px; padding:4px 7px; }
.sync:hover{ background:var(--surface-2); border-color:var(--border); color:var(--text); }
.sync:disabled{ opacity:.6; cursor:default; }
.dot{ width:7px; height:7px; border-radius:50%; background:var(--good); flex:none; }
.dot.spin{ animation:fillco-spin 0.8s linear infinite; }
@keyframes fillco-spin{ 0%{opacity:1;} 50%{opacity:.25;} 100%{opacity:1;} }
.dot.off{ background:var(--text-mute); }

/* tabs */
.tabs{ display:flex; gap:4px; overflow-x:auto; border-bottom:1px solid var(--border); margin-bottom:16px; -webkit-overflow-scrolling:touch; }
.tab{ appearance:none; border:none; background:none; color:var(--text-mute); font:inherit; font-size:13px; font-weight:600; padding:9px 13px; border-bottom:2px solid transparent; cursor:pointer; white-space:nowrap; border-radius:6px 6px 0 0; }
.tab:hover{ color:var(--text); background:var(--surface-2); }
.tab[aria-selected="true"]{ color:var(--accent); border-bottom-color:var(--accent); }

.view{ display:flex; flex-direction:column; gap:16px; }

/* cards */
.card{ background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); box-shadow:var(--shadow); padding:16px; }
.card-head{ display:flex; align-items:baseline; justify-content:space-between; gap:10px; margin-bottom:12px; flex-wrap:wrap; }
.card-head h2{ font-size:14.5px; }
.card-head .hint{ font-size:11.5px; color:var(--text-mute); }
.grid-cards{ display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:10px; }
.stat{ background:var(--surface-2); border-radius:8px; padding:11px 13px; display:flex; flex-direction:column; gap:3px; }
.stat .label{ font-size:11px; color:var(--text-mute); text-transform:uppercase; letter-spacing:.05em; }
.stat .value{ font-size:21px; font-weight:700; font-family:"IBM Plex Mono",monospace; }
.stat .delta{ font-size:11.5px; }

/* buttons/inputs */
button{ font:inherit; cursor:pointer; }
.btn{ background:var(--accent); color:#fff; border:none; border-radius:7px; padding:8px 13px; font-size:13px; font-weight:600; }
.btn:hover{ background:var(--accent-2); }
.btn.ghost{ background:transparent; color:var(--accent); border:1px solid var(--border); }
.btn.ghost:hover{ background:var(--accent-soft); }
.btn.sm{ padding:5px 9px; font-size:12px; border-radius:6px; }
.btn.danger{ background:transparent; color:var(--bad); border:1px solid var(--border); }
.btn.danger:hover{ background:var(--bad-soft); }
input,select,textarea{
  font:inherit; font-size:13px; color:var(--text); background:var(--surface);
  border:1px solid var(--border); border-radius:7px; padding:7px 9px; width:100%;
}
input:focus,select:focus,textarea:focus{ outline:2px solid var(--accent); outline-offset:1px; }
label{ font-size:11.5px; color:var(--text-mute); display:flex; flex-direction:column; gap:4px; font-weight:600; }
.form-grid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(120px,1fr)); gap:10px; align-items:end; }
.form-actions{ display:flex; gap:8px; justify-content:flex-end; margin-top:10px; }

/* table */
.table-wrap{ overflow-x:auto; }
table{ width:100%; border-collapse:collapse; font-size:12.8px; min-width:560px; }
th{ text-align:start; font-size:10.8px; text-transform:uppercase; letter-spacing:.05em; color:var(--text-mute); padding:7px 9px; border-bottom:1px solid var(--border); white-space:nowrap; }
td{ padding:8px 9px; border-bottom:1px solid var(--border); vertical-align:middle; }
tr:last-child td{ border-bottom:none; }
tbody tr:hover{ background:var(--surface-2); }
.num{ font-family:"IBM Plex Mono",monospace; font-variant-numeric:tabular-nums; text-align:right; }

/* pills */
.pill{ display:inline-flex; align-items:center; gap:5px; padding:2.5px 8px; border-radius:99px; font-size:11px; font-weight:600; white-space:nowrap; }
.pill.good{ background:var(--good-soft); color:var(--good); }
.pill.warn{ background:var(--warn-soft); color:var(--warn); }
.pill.bad{ background:var(--bad-soft); color:var(--bad); }
.pill.mute{ background:var(--surface-2); color:var(--text-mute); }
.pill.accent{ background:var(--accent-soft); color:var(--accent); }

/* capacity bars */
.cap-row{ display:grid; grid-template-columns:120px 1fr 64px; gap:10px; align-items:center; padding:7px 0; border-bottom:1px solid var(--border); }
.cap-row:last-child{ border-bottom:none; }
.cap-row .who{ font-size:12.3px; font-weight:600; }
.cap-row .who .sub{ display:block; font-size:10.8px; font-weight:400; color:var(--text-mute); }
.bar-track{ position:relative; height:16px; background:var(--surface-2); border-radius:5px; overflow:hidden; }
.bar-fill{ position:absolute; inset:0 auto 0 0; border-radius:5px; background:var(--accent); }
.bar-fill.over{ background:var(--bad); }
.bar-fill.warn{ background:var(--warn); }
.cap-row .pct{ font-family:"IBM Plex Mono",monospace; font-size:12px; text-align:right; }

.drag-handle{ cursor:grab; color:var(--text-mute); font-size:15px; text-align:center; width:22px; user-select:none; }
tr.dragging{ opacity:.4; }
tr.drag-over{ outline:2px dashed var(--accent); outline-offset:-2px; }
.empty{ color:var(--text-mute); font-size:12.5px; padding:18px 8px; text-align:center; }
.section-title{ font-size:12px; font-weight:700; text-transform:uppercase; letter-spacing:.04em; color:var(--text-mute); margin:2px 0 2px; }
.two-col{ display:grid; grid-template-columns:1.3fr 1fr; gap:16px; }
@media (max-width:760px){ .two-col{ grid-template-columns:1fr; } }
.row-flex{ display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
.filter-bar{ display:flex; gap:8px; flex-wrap:wrap; margin-bottom:12px; }
.filter-bar select, .filter-bar input{ width:auto; min-width:110px; }
.legend{ display:flex; gap:14px; flex-wrap:wrap; font-size:11.5px; color:var(--text-mute); }
.legend span.sw{ display:inline-block; width:8px; height:8px; border-radius:2px; margin-right:5px; }
.close-x{ background:none; border:none; color:var(--text-mute); font-size:16px; line-height:1; padding:2px 4px; }
.close-x:hover{ color:var(--bad); }
.modal-backdrop{ position:fixed; inset:0; background:rgba(10,14,12,.45); display:flex; align-items:flex-start; justify-content:center; padding:5vh 16px; z-index:50; overflow-y:auto; }
.modal{ background:var(--surface); border-radius:var(--radius); box-shadow:var(--shadow); padding:18px; width:100%; max-width:480px; border:1px solid var(--border); }
.modal h3{ font-size:15px; margin-bottom:12px; }
[hidden]{ display:none!important; }
.footer-note{ font-size:11px; color:var(--text-mute); text-align:center; padding-top:10px; }
html[dir="rtl"] body{ font-family:"Cairo","IBM Plex Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
html[dir="rtl"] .mono{ font-family:"IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace; direction:ltr; unicode-bidi:isolate; }
html[dir="rtl"] .num{ direction:ltr; unicode-bidi:isolate; }
.print-slip{ display:none; }
@media print{
  body > *:not(.print-slip){ display:none!important; }
  .print-slip{ display:block!important; padding:0; color:#000; background:#fff; }
}
</style>

<body>

<div id="loginRoot"></div>

<div class="shell" id="appShell" hidden>
  <div class="topbar">
    <div class="brand">
      <div class="brand-mark"><img id="brandLogo" alt="FILLCO"></div>
      <div>
        <h1>Production Planner</h1>
        <div class="sub">FILLCO &middot; fiber roll manufacturing</div>
      </div>
    </div>
    <div class="row-flex" style="gap:10px;">
      <button class="sync" id="syncStatus" type="button" title="Refresh"><span class="dot off" id="syncDot"></span><span id="syncText">Connecting…</span></button>
      <span class="pill mute" id="custBadge" hidden>🔒 Customer names hidden for your access level</span>
      <span class="hint" id="userBox"></span>
      <button class="btn ghost sm" id="logoutBtn" type="button" hidden>Log out</button>
    </div>
  </div>

  <div class="tabs" role="tablist" id="tabs">
    <button class="tab" role="tab" data-view="dashboard">Dashboard</button>
    <button class="tab" role="tab" data-view="log">Log Production</button>
    <button class="tab" role="tab" data-view="loading">Loading</button>
    <button class="tab" role="tab" data-view="schedule">Schedule</button>
    <button class="tab" role="tab" data-view="history">History</button>
    <button class="tab" role="tab" data-view="capacity">Capacity</button>
    <button class="tab" role="tab" data-view="orders">Orders</button>
    <button class="tab" role="tab" data-view="settings">Settings</button>
  </div>

  <div id="views"></div>
  <div class="footer-note">Shared plan &middot; changes sync live to everyone with this page open.</div>
</div>

<div id="modalRoot"></div>

/* Merges the known customer list with any customer names already used in live data
   (orders/schedule/logs), so a name typed once keeps showing up even if it's not
   on the master list. Case-insensitive de-dupe, alphabetically sorted. */
function customerOptions(){
  const seen = new Map(); // lowercase -> display form (first one wins)
  CUSTOMER_LIST.forEach(n=>{ const k=n.toLowerCase(); if(!seen.has(k)) seen.set(k,n); });
  [state.orders, state.schedule].forEach(list=>{
    (list||[]).forEach(o=>{
      const n = (o.customer||"").trim();
      if(!n) return;
      const k = n.toLowerCase();
      if(!seen.has(k)) seen.set(k,n);
    });
  });
  return [...seen.values()].sort((a,b)=>a.localeCompare(b));
}

function uid(prefix){ return prefix+"_"+Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function todayStr(){ const d=new Date(); return d.toISOString().slice(0,10); }
/* Date-string arithmetic done entirely in UTC so it can't slip a day in a UTC+ timezone
   (local midnight → toISOString would land on the previous date in Cairo). */
function addDaysStr(dateStr, n){ const d=new Date(dateStr+"T00:00:00Z"); d.setUTCDate(d.getUTCDate()+n); return d.toISOString().slice(0,10); }
function fmt1(n){ return (Math.round(n*100)/100).toLocaleString(); }
function fmt0(n){ return Math.round(n).toLocaleString(); }
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function custDisplay(name){
  if(state.canSeeCustomer) return name || "—";
  return t("hiddenTag");
}

/* The "signal" on each run is how its speed compares to a benchmark. That benchmark
   is pulled from the Manufacturing Log itself: the NET-HOURS-WEIGHTED average kg/h of
   every past run with the same product type + GSM (+ width, when we have enough history
   at that exact width) — not a fixed number someone typed into Settings once, and not a
   simple per-run average either. It is sum(actual kg produced) / sum(net run hours) across
   the matching runs, so a near-zero-net-hour run (heavy stoppage, tiny output — which would
   produce a wild, noisy kg/h if averaged with equal weight) barely moves the benchmark,
   while a full, stable run counts for what it's worth. Settings' rate table (and
   DEFAULT_RATES) only kicks in as a fallback for a type/GSM/width combo that has no
   logged history yet. */
function benchmarkFromLogs(type,gsm,width){
  const sameType = state.logs.filter(l=>l.productType===type && Number(l.gsm)===Number(gsm) && netRunHours(l)>0);
  function weightedRate(list){
    const totalHrs = list.reduce((a,l)=>a+netRunHours(l),0);
    if(totalHrs<=0) return null;
    const totalKg = list.reduce((a,l)=>a+(Number(l.actualQtyKg)||0),0);
    return totalKg/totalHrs;
  }
  if(width){
    const sameWidth = sameType.filter(l=>Number(l.width)===Number(width));
    if(sameWidth.length){
      const r = weightedRate(sameWidth);
      if(r!=null) return r;
    }
  }
  if(sameType.length) return weightedRate(sameType);
  return null;
}
function rateFor(type,gsm,width,settings){
  const hist = benchmarkFromLogs(type,gsm,width);
  if(hist!=null && hist>0) return hist;
  const rates = (settings && settings.rates) || DEFAULT_RATES;
  if(width){
    const wKey = type+"|"+gsm+"|"+width;
    if(rates[wKey]!=null) return rates[wKey];
  }
  const key = type+"|"+gsm;
  if(rates[key]!=null) return rates[key];
  return DEFAULT_RATE_FALLBACK;
}
/* Speed (kg/h) is computed on NET running time — hours run minus stoppage time —
   not on total hours logged, so a stopped line doesn't drag down the measured
   machine speed. The kg "wasted" by a stoppage is then that net speed applied
   to the stopped time: what the line would have produced had it kept running. */
function netRunHours(l){
  const h = Number(l.actualHours)||0;
  const stopH = (Number(l.stoppageMinutes)||0)/60;
  return Math.max(h - stopH, 0);
}
function netRateKgH(l){
  const netH = netRunHours(l);
  const qty = Number(l.actualQtyKg)||0;
  return netH>0 ? qty/netH : 0;
}
function wastedKgFromStoppage(l){
  const stopH = (Number(l.stoppageMinutes)||0)/60;
  if(stopH<=0) return 0;
  const rate = netRateKgH(l) || rateFor(l.productType, l.gsm, l.width, state.settings);
  return stopH * rate;
}

/* ---------- self-hosted REST API layer ----------
   Replaces the Claude.ai Artifact platform's "db" capability
   (window.claude.use("db"), .collection(x).onSnapshot(...)) with plain
   fetch() calls against this server's own /api/* routes (see README.md).
   The owner chose refresh-based sync over a live push channel for this new
   system, so instead of onSnapshot() keeping state.orders/schedule/logs/
   deliverySlips updated forever, we fetch each collection once on load
   (fetchAll, called from boot()), merge each write's own server response
   straight into local state as it happens (mergeIntoState/removeFromState),
   and otherwise refresh via the header's sync/refresh control or a tab
   switch (refetchForView) — see boot()/refreshAll() below. */
const COLLECTION_PATH = { orders:"orders", schedule:"schedule", logs:"logs", deliverySlips:"delivery-slips" };
let db = true; // kept as a truthy sentinel: lots of existing code below checks `if(!db)` to mean "not signed in / can't save" — true once logged in, see boot()/showLoginScreen().

async function apiFetch(path, opts){
  const res = await fetch(path, Object.assign({ credentials:"same-origin", headers: Object.assign({"Content-Type":"application/json"}, (opts&&opts.headers)||{}) }, opts||{}));
  // A 401 from /api/login itself just means "wrong username/password" — let the
  // caller (the login form) show that inline. A 401 from anywhere else means the
  // session cookie is missing/expired/revoked, so drop back to the login screen.
  if(res.status===401 && path!=="/api/login"){
    db = false;
    showLoginScreen();
    throw new Error("unauthorized");
  }
  if(!res.ok){
    let msg = "";
    try{ const j = await res.json(); msg = (j && j.error) || ""; }catch(e){}
    throw new Error(msg || ("HTTP "+res.status));
  }
  if(res.status===204) return null;
  const ct = res.headers.get("content-type")||"";
  return ct.includes("application/json") ? res.json() : null;
}
function apiGet(path){ return apiFetch(path); }
function apiPost(path, body){ return apiFetch(path, {method:"POST", body: JSON.stringify(body||{})}); }
function apiPut(path, body){ return apiFetch(path, {method:"PUT", body: JSON.stringify(body||{})}); }
function apiPatch(path, body){ return apiFetch(path, {method:"PATCH", body: JSON.stringify(body||{})}); }
function apiDelete(path){ return apiFetch(path, {method:"DELETE"}); }

function mergeIntoState(col, row){
  if(!row) return row;
  const arr = state[col];
  const idx = arr.findIndex(x=>x.id===row.id);
  if(idx>=0) arr[idx] = row; else arr.push(row);
  return row;
}
function removeFromState(col, id){
  state[col] = state[col].filter(x=>x.id!==id);
}
/* Mirrors a delivery slip's own roll snapshot (its authoritative weights/loaded
   state, straight from the server) onto the matching rolls embedded in
   state.logs, so the Loading tab reflects a slip create/check/delete
   immediately without a round trip. */
function patchLogsRollsFromSlip(slip){
  const byLog = new Map();
  (slip.rolls||[]).forEach(r=>{ if(!byLog.has(r.logId)) byLog.set(r.logId, []); byLog.get(r.logId).push(r); });
  byLog.forEach((rollRefs, logId)=>{
    const log = state.logs.find(l=>l.id===logId);
    if(!log) return;
    log.rolls = (log.rolls||[]).map(x=>{
      const match = rollRefs.find(r=>r.rollId===x.id);
      if(!match) return x;
      return Object.assign({}, x, {loaded:true, weightKg:match.weightKg, driver:slip.driver, deliveryDate:slip.deliveryDate, slipId:slip.id});
    });
  });
}
/* Merges one updated roll (from a PATCH /api/logs/:logId/rolls/:rollId response)
   back into its parent log's embedded rolls array, and keeps that log's own
   actualQtyKg equal to the sum of its rolls — mirroring what the backend already
   did server-side, so the Loading/Log Production tabs don't need a refetch. */
function mergeRollIntoLog(logId, roll){
  const log = state.logs.find(l=>l.id===logId);
  if(!log || !roll) return;
  log.rolls = (log.rolls||[]).map(x=> x.id===roll.id ? roll : x);
  log.actualQtyKg = Math.round((log.rolls||[]).reduce((a,x)=>a+(Number(x.weightKg)||0),0)*100)/100;
}
function patchLogsRollsRevert(slip){
  const bySlipRolls = new Map();
  (slip.rolls||[]).forEach(r=>{ if(!bySlipRolls.has(r.logId)) bySlipRolls.set(r.logId, new Set()); bySlipRolls.get(r.logId).add(r.rollId); });
  bySlipRolls.forEach((rollIds, logId)=>{
    const log = state.logs.find(l=>l.id===logId);
    if(!log) return;
    log.rolls = (log.rolls||[]).map(x=> rollIds.has(x.id) ? Object.assign({}, x, {loaded:false, loadedAt:null, driver:null, deliveryDate:null, slipId:null}) : x);
  });
}

/* Fetches every collection once (replacing the old onSnapshot subscriptions),
   on initial login and from the Refresh control. Scoped with the same kind of
   date/limit query params the UI already filters by, per collection, rather
   than always pulling everything. */
async function fetchAll(){
  // No date filter on logs here: benchmarkFromLogs/rateFor scan the full set of
  // recent logs (same as the original app's un-dated, most-recent-300 onSnapshot
  // cap), so this pulls a generously high recent slice by count instead — plenty
  // for a small shop's history, and still far cheaper than "everything forever".
  const [orders, schedule, logs, deliverySlips, settings] = await Promise.all([
    apiGet("/api/orders?limit=1000"),
    apiGet("/api/schedule?limit=1000"),
    apiGet("/api/logs?limit=3000"),
    apiGet("/api/delivery-slips?limit=500"),
    apiGet("/api/settings"),
  ]);
  state.orders = orders; state.schedule = schedule; state.logs = logs; state.deliverySlips = deliverySlips;
  state.settings = settings;
  state.dbReady = true;
  sweepLoaded.schedule = true; sweepLoaded.logs = true;
  recomputeCustomerVisibility();
  if(state.role==="admin"){
    try{ state.users = await apiGet("/api/users"); }catch(e){ state.users = []; }
  }
  queueStatusSweep();
}
/* The header's sync/refresh control, and the initial fetch. Shows a brief
   spinning-dot state so a tap has visible feedback even on a fast LAN. */
async function refreshAll(){
  if(state.refreshing) return;
  state.refreshing = true;
  const dot = document.getElementById("syncDot"), txt = document.getElementById("syncText"), btn = document.getElementById("syncStatus");
  if(btn) btn.disabled = true;
  if(dot) dot.classList.add("spin");
  if(txt) txt.textContent = t("syncRefreshing");
  try{ await fetchAll(); }
  catch(e){ console.error(e); }
  finally{
    state.refreshing = false;
    if(btn) btn.disabled = false;
    if(dot) dot.classList.remove("spin");
    if(txt) txt.textContent = t("syncSynced");
    render();
  }
}
/* Re-fetches just the data a tab actually shows, on switching into it — cheap
   and keeps things reasonably fresh without a live push channel. Dashboard
   and Log Production both want "today"; History/Capacity/Orders/Settings
   read whatever's already loaded (History has its own explicit search). */

/* ---------- write helpers ----------
   Same function names/shapes the rest of this file already calls
   (addDoc/addDocWithId/updateDoc/deleteDoc/saveSettings) — only the inside
   changed, from the "db" capability to fetch() against /api/*. Each one
   merges the server's own response (the authoritative row) into local
   state, since there's no onSnapshot to do that for us anymore. */
async function addDoc(col, data){
  if(!db) return showToast(t("previewNoSync"));

  catch(e){ console.error(e); showToast(t("couldntSave")); }
}
/* Like addDoc, but the caller immediately needs the new row's real id (e.g. a
   freshly-created order that's being scheduled in the same step) — the id is
   now assigned by the server, so this just awaits the same POST addDoc does. */
async function addDocWithId(col, data){
  const row = await addDoc(col, data);
  return row ? row.id : null;
}
async function updateDoc(col, id, data){
  if(!db) return showToast(t("previewNoSync"));
  try{ const row = await apiPut(`/api/${COLLECTION_PATH[col]}/${id}`, data); mergeIntoState(col, row); render(); return row; }
  catch(e){ console.error(e); showToast(t("couldntSave")); }
}
async function deleteDoc(col, id){

  catch(e){ console.error(e); showToast(t("couldntDelete")); }
}
async function saveSettings(patch){
  if(!db) { state.settings = {...state.settings, ...patch}; return render(); }
  try{ state.settings = await apiPut("/api/settings", patch); recomputeCustomerVisibility(); render(); }
  catch(e){ console.error(e); showToast(t("couldntSaveSettings")); }

/* ---------- capacity engine ----------
   Capacity is computed from the SCHEDULE (scheduled runs), not the raw order backlog —
   and only counts what's still outstanding: a run already marked Done/Skipped contributes
   nothing, and a run that's partway through only counts its remaining hours (planned minus
   whatever has already been logged against it). */
function remainingHoursForEntry(entry){
  const loggedHrs = state.logs.filter(l=>l.scheduleId===entry.id).reduce((a,l)=>a+(Number(l.actualHours)||0),0);
  return Math.max((Number(entry.plannedHours)||0) - loggedHrs, 0);
}

/* A scheduled run is fulfilled by one or more logged runs against it. "Done" only when the
   logged total actually covers what was planned (within a 3% tolerance) — short of that it's
   "Partially done", so a run that only got half-produced doesn't silently read as finished. */
function loggedQtyForSchedule(scheduleId){
  return state.logs.filter(l=>l.scheduleId===scheduleId).reduce((a,l)=>a+(Number(l.actualQtyKg)||0),0);
}
async function syncScheduleStatus(scheduleId, overrideLog){
  if(!scheduleId) return;
  const s = state.schedule.find(x=>x.id===scheduleId);
  if(!s || s.status==="Skipped") return;
  let logsForS = state.logs.filter(l=>l.scheduleId===scheduleId);
  // state.logs may not yet reflect the write we just made (it arrives async via onSnapshot) —
  // fold in the log we just saved/edited so the status reflects it immediately.
  if(overrideLog) logsForS = logsForS.filter(l=>l.id!==overrideLog.id).concat([overrideLog]);
  const stillRunning = logsForS.some(l=>l.startTime && !l.endTime);
  const logged = logsForS.reduce((a,l)=>a+(Number(l.actualQtyKg)||0),0);
  const planned = Number(s.plannedQtyKg)||0;
  let status = s.status;
  if(stillRunning) status = "Running";
  else if(logged>0) status = (planned>0 && logged < planned*0.97) ? "Partially Done" : "Done";
  if(status!==s.status) await updateDoc("schedule", scheduleId, {status});
  if(s.orderId) await syncOrderStatus(s.orderId, {id: scheduleId, status});
}
/* Rolls a linked order's status up from all of its scheduled runs: Complete only once every
   run tied to that order is Done/Skipped, Partially complete as soon as any run has finished
   (fully or partially), otherwise the order's status is left alone. */
async function syncOrderStatus(orderId, overrideSched){
  if(!orderId) return;
  const order = state.orders.find(o=>o.id===orderId);
  if(!order) return;
  // same async-snapshot caveat as above: use the status we just wrote for that one run
  const ovs = overrideSched ? [].concat(overrideSched) : [];
  const scheds = state.schedule.filter(s=>s.orderId===orderId)
    .map(s=>{ const ov = ovs.find(o=>o.id===s.id); return ov ? Object.assign({}, s, {status: ov.status}) : s; });
  if(!scheds.length) return;
  const allDone = scheds.every(s=>s.status==="Done"||s.status==="Skipped");
  const anyFinished = scheds.some(s=>s.status==="Done"||s.status==="Partially Done");
  let status = null;
  if(allDone) status = "Complete";
  else if(anyFinished) status = "Partially Complete";
  if(status && order.status!==status) await updateDoc("orders", orderId, {status});
}

/* SO numbers get typed every which way on the floor ("SO 2917", "S0 2917", "so 2917") —
   compare them by their digits so they all count as the same order. */
function normSo(so){
  const s = String(so||"").trim().toLowerCase();
  const digits = s.replace(/\D/g,"");
  return digits || s;
}
function sameSo(a,b){ const x=normSo(a), y=normSo(b); return !!x && x===y; }

/* Background tidy-up: a lot of runs get logged "ad hoc" (without picking the scheduled run),
   which left their scheduled entries stuck on Planned forever. For every still-open scheduled
   run dated today or earlier, count finished logs for the same SO + item (type, GSM, and width
   when both sides have one) logged on or up to 3 days after the run's date — each log's kg is
   only counted once, earliest runs first — and set Done / Partially done from that. Entries that
   already have logs linked to them directly are left to syncScheduleStatus. */
const sweepLoaded = {schedule:false, logs:false};
let sweepTimer = null, sweepRunning = false;
function queueStatusSweep(){
  if(!sweepLoaded.schedule || !sweepLoaded.logs || !db) return;
  clearTimeout(sweepTimer);
  sweepTimer = setTimeout(runStatusSweep, 2500);
}
async function runStatusSweep(){
  if(sweepRunning) return;
  sweepRunning = true;
  try{
    const today = todayStr();
    const linkedIds = new Set(state.logs.filter(l=>l.scheduleId).map(l=>l.scheduleId));
    const pool = state.logs.filter(l=>!l.scheduleId && !(l.startTime && !l.endTime))
      .map(l=>({l, left:Number(l.actualQtyKg)||0}));
    const candidates = state.schedule
      .filter(s=>(s.status==="Planned"||s.status==="Running"||!s.status) && s.date && s.date<=today && !linkedIds.has(s.id))
      .sort((a,b)=>(a.date+String(a.seq??0).padStart(3,"0")).localeCompare(b.date+String(b.seq??0).padStart(3,"0")));
    const orderOverrides = new Map(); // orderId -> [{id,status}] just written
    for(const s of candidates){
      const planned = Number(s.plannedQtyKg)||0;
      let got = 0;
      const lastDay = addDaysStr(s.date, 3);
      for(const p of pool){
        if(p.left<=0) continue;
        const l = p.l;
        if(!sameSo(l.so, s.so) || l.productType!==s.productType || Number(l.gsm)!==Number(s.gsm)) continue;
        if(s.width && l.width && Number(s.width)!==Number(l.width)) continue;
        if(!l.date || l.date<s.date || l.date>lastDay) continue;
        const take = planned>0 ? Math.min(p.left, Math.max(planned-got,0)) : p.left;
        if(take<=0) continue;
        got += take; p.left -= take;
        if(planned>0 && got>=planned) break;
      }
      if(got<=0) continue;
      const status = (planned>0 && got < planned*0.97) ? "Partially Done" : "Done";
      if(status!==s.status){
        await updateDoc("schedule", s.id, {status});
        if(s.orderId){ if(!orderOverrides.has(s.orderId)) orderOverrides.set(s.orderId, []); orderOverrides.get(s.orderId).push({id:s.id, status}); }
      }
    }
    for(const [oid, ovs] of orderOverrides) await syncOrderStatus(oid, ovs);
  }catch(e){ console.error("status sweep", e); }
  finally{ sweepRunning = false; }
}
function computeCapacity(dateFilter){
  const dates = dateFilter ? [dateFilter] : [...new Set(state.schedule.map(s=>s.date))].sort();
  const lines = state.settings.lines;
  const rows = [];
  dates.forEach(date=>{
    lines.forEach(line=>{
      SHIFTS.forEach(sh=>{
        const allEntries = state.schedule.filter(s=>s.date===date && s.line===line && s.shift===sh.id);
        const entries = allEntries.filter(s=>s.status!=="Done" && s.status!=="Skipped");
        const remainingHours = entries.reduce((a,s)=>a+remainingHoursForEntry(s),0);
        const changeoverLoss = allEntries.length>1 ? (allEntries.length-1)*(state.settings.changeoverMin/60) : 0;
        const effective = Math.max(sh.hours - changeoverLoss, 0);
        const util = effective>0 ? remainingHours/effective : 0;
        rows.push({date,line,shift:sh.id,shiftLabel:sh.label,entries,plannedHours:remainingHours,effective,available:sh.hours,changeoverLoss,util});
      });
    });
  });
  return rows;
}

/* ---------- rendering ---------- */
let pendingRender = false;
/* A background db update (someone else's edit, or the echo of your own write) fires
   onSnapshot at any moment, and render() rebuilds the whole current tab from scratch —
   including whatever a shift supervisor is mid-typing into the Log Production form.
   That looked like the app "suddenly exiting" what they were doing. So: while focus is
   on a live TEXT-ENTRY field (typing a number, a date, a note…), defer the rebuild until
   they're done with it (blur). A checkbox/radio/select isn't something you "type into" —
   guarding those too just made a single click on a roll-check box look like it needed two
   (the first click's rebuild got deferred, then arrived a beat late holding stale data and
   visually un-checked it) — so those always rebuild immediately. */
function render(){
  const views = document.getElementById("views");
  const active = document.activeElement;
  const isTextEntry = active && /^(INPUT|TEXTAREA)$/.test(active.tagName) && !/^(checkbox|radio|button|submit|file|color|range)$/.test((active.type||"").toLowerCase());
  if(active && views && views.contains(active) && isTextEntry){
    pendingRender = true;
    return;
  }
  pendingRender = false;
  document.querySelectorAll(".tab").forEach(t=>t.setAttribute("aria-selected", t.dataset.view===state.view ? "true":"false"));
  const root = views;
  root.innerHTML = "";
  const fn = {dashboard:viewDashboard, log:viewLogProduction, loading:viewLoading, schedule:viewSchedule, history:viewHistory, capacity:viewCapacity, orders:viewOrders, settings:viewSettings}[state.view];
  root.appendChild(fn());
}
document.addEventListener("focusout", (e)=>{
  if(!pendingRender) return;
  setTimeout(()=>{ if(pendingRender) render(); }, 150); // give a click (e.g. an "add roll" button) time to land first
});

function el(tag, attrs, children){
  const e = document.createElement(tag);
  if(attrs) for(const k in attrs){
    if(k==="html") e.innerHTML = attrs[k];
    else if(k.startsWith("on")) e.addEventListener(k.slice(2), attrs[k]);
    else e.setAttribute(k, attrs[k]);
  }
  (children||[]).forEach(c=> c!=null && e.appendChild(typeof c==="string"?document.createTextNode(c):c));
  return e;
}

    filterBar.appendChild(searchInp);

    actCard.appendChild(tableHolder);

    const sortedLogs = state.logs.slice().sort((a,b)=>{
      const ak = (a.date||"")+" "+(a.startTime||"00:00");
      const bk = (b.date||"")+" "+(b.startTime||"00:00");
      return bk.localeCompare(ak); // most recent start time first
    });

    function renderActTable(){

function shortCat(c){ if(!c) return "—"; return c.length>22? c.slice(0,20)+"…": c; }

/* ---- On-time delivery: an order is on time when its first delivery slip is dated within
   3 days of the day the order was entered. New orders carry createdAt; older ones made through
   the app still have their creation time encoded in their id, so they're recovered from that. */
const ON_TIME_DAYS = 3;
function orderCreatedDate(o){
  if(o.createdAt) return String(o.createdAt).slice(0,10);
  const m = /^ord_([0-9a-z]{8})/.exec(o.id||"");
  if(m){ const ms = parseInt(m[1],36); if(ms>1.5e12 && ms<2.5e12) return new Date(ms).toISOString().slice(0,10); }
  return null;
}
function onTimeRows(){
  const today = todayStr();
  const rows = [];
  state.orders.forEach(o=>{
    const created = orderCreatedDate(o);
    if(!created) return;
    const deadline = addDaysStr(created, ON_TIME_DAYS);
    const dates = state.deliverySlips.filter(s=>sameSo(s.so, o.so) && s.deliveryDate).map(s=>s.deliveryDate).sort();
    const first = dates[0] || null;
    let verdict = null; // "onTime" | "late" | "lateOpen" (past deadline, nothing delivered) | null (still inside the window)
    if(first) verdict = first<=deadline ? "onTime" : "late";
    else if(today>deadline && o.status!=="Complete") verdict = "lateOpen";
    if(verdict) rows.push({o, created, deadline, first, verdict});
  });
  return rows.sort((a,b)=>(b.first||b.deadline).localeCompare(a.first||a.deadline));
}
function buildOnTimeCard(){
  const card = el("div",{class:"card"});
  card.appendChild(el("div",{class:"card-head"},[el("h2",{},[t("onTimeTitle")]), el("span",{class:"hint"},[t("onTimeHint")])]));
  const rows = onTimeRows();
  const delivered = rows.filter(r=>r.first);
  if(!rows.length){
    card.appendChild(el("div",{class:"empty"},[t("onTimeNoData")]));
    return card;
  }
  const onTime = delivered.filter(r=>r.verdict==="onTime").length;
  const late = rows.filter(r=>r.verdict!=="onTime").length;
  const pct = rows.length ? onTime/rows.length*100 : null;
  card.appendChild(el("div",{class:"grid-cards"},[
    statCard(t("onTimeRate"),"", pct==null ? "—" : pct.toFixed(0)+"%"),
    statCard(t("onTimeDelivered"),"", String(delivered.length)),
    statCard(t("onTimeLate"),"", String(late)),
  ]));
  const tw = el("div",{class:"table-wrap", style:"margin-top:10px;"});
  const tbl = el("table");
  tbl.appendChild(el("thead",{},[el("tr",{},[t("colSO"),t("colCustomer"),t("colOrdered"),t("colDeadline"),t("colFirstDelivery"),t("colStatus")].map(h=>el("th",{},[h])))]));
  const tb = el("tbody");
  rows.slice(0,15).forEach(r=>{
    const pill = r.verdict==="onTime" ? el("span",{class:"pill good"},[t("onTimeWord")])
      : el("span",{class:"pill bad"},[t("onTimeLate")]);
    tb.appendChild(el("tr",{},[
      el("td",{class:"mono"},[r.o.so||"—"]),
      el("td",{},[custDisplay(r.o.customer)]),
      el("td",{},[r.created]),
      el("td",{},[r.deadline]),
      el("td",{},[r.first||"—"]),
      el("td",{},[pill]),
    ]));
  });
  tbl.appendChild(tb); tw.appendChild(tbl); card.appendChild(tw);
  return card;
}


/* ---- export logged runs as a Manufacturing Log CSV, for pasting into the master workbook ---- */
function csvEscape(v){
  const s = v==null ? "" : String(v);
  return /[",\n]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s;
}
/* Real browser download — a Blob + a temporary <a download> click. Works
   natively in a plain browser, an Electron webview, or a Capacitor (Android)
   webview, so this replaces both the old "downloads" capability (which
   needed a window.claude.use("downloads") check and an unavailable-in-preview
   fallback) and the "mcp" capability's Google Drive upload (which has no
   equivalent once this isn't running inside Claude.ai) — see the delivery
   slip download and the Settings → data export card below. */
function downloadFile(filename, content, mime){
  const blob = new Blob([content], {type: mime||"application/octet-stream"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 1000);
}
/* Mirrors the exact column layout of the real Manufacturing Log workbook
   (the "Manufacturing Log" tab of Manufacturing_Log_Template.xlsx) so a
   shift supervisor can select these columns and paste them straight into
   the master sheet with no re-mapping. */
const MASTER_LOG_HEADER = [
  "Date","Shift","Sales Order Number","Customer (optional cross-check)","Product Type","GSM","Width (cm)",
  "Machine ID","Operator","Roll Count","Total Quantity (kg)","Start Time","Finish Time","Duration (auto)",
  "Actual Production Time (hh:mm)","Production Rate kg/h (auto)",
  "Stoppage Time 1 (hh:mm)","Stoppage Category 1","Stoppage Detail 1",
  "Stoppage Time 2 (hh:mm)","Stoppage Category 2","Stoppage Detail 2",
  "Time Loss Between Orders (hh:mm)","Changeover Reason","Scrap/Waste Weight (kg)","Notes"
];
const MASTER_SHIFT_LABEL = { Morning: "Morning - صباحى", Evening: "Evening - مسائى" };
function minutesToHHMM(min){
  const m = Math.round(Number(min)||0);
  if(m<=0) return "";
  const h = Math.floor(m/60), rem = m%60;
  return h+":"+String(rem).padStart(2,"0");
}
function hoursToHHMM(hrs){
  return minutesToHHMM((Number(hrs)||0)*60);
}
function customerForLog(l){
  const sched = l.scheduleId ? state.schedule.find(s=>s.id===l.scheduleId) : null;
  const order = (sched && (state.orders.find(o=>o.id===sched.orderId) || state.orders.find(o=>o.so===sched.so)))
    || state.orders.find(o=>o.so===l.so);
  const name = sched && sched.customer ? sched.customer : (order ? order.customer : "");
  return state.canSeeCustomer ? (name||"") : "";
}
function masterLogRow(l){
  const duration = hoursToHHMM(l.actualHours);
  const netProdTime = hoursToHHMM(netRunHours(l));
  const rate = netRateKgH(l);
  const isChangeover = l.stoppageCategory === "Changeover / Time Loss Between Orders";
  return [
    l.date||"",
    MASTER_SHIFT_LABEL[l.shift] || l.shift || "",
    l.so||"",
    customerForLog(l),
    l.productType||"",
    l.gsm||"",
    l.width||"",
    l.line||"",
    l.operator||"",
    (l.rolls && l.rolls.length) ? l.rolls.length : "",
    l.actualQtyKg||"",
    l.startTime||"",
    l.endTime||"",
    duration,
    netProdTime,
    rate ? Math.round(rate*100)/100 : "",
    isChangeover ? "" : minutesToHHMM(l.stoppageMinutes),
    isChangeover ? "" : (l.stoppageCategory||""),
    "", // Stoppage Detail 1 — not tracked separately from Notes
    "", "", "", // Stoppage Time 2 / Category 2 / Detail 2 — app logs one stoppage per run
    isChangeover ? minutesToHHMM(l.stoppageMinutes) : "",
    "", // Changeover Reason — not tracked separately
    "", // Scrap/Waste Weight (kg) — not tracked
    l.notes||"",
  ];
}
/* Downloads the Manufacturing Log CSV for one date/shift directly (see
   downloadFile above) — this used to upload the same CSV into the shop's
   Google Drive folder via the "mcp" capability; that integration has no
   equivalent outside Claude.ai, so a plain download the shift supervisor can
   paste from is the closest match and needs no connector of any kind. */
function exportLogsToDrive(date, shiftFilter){
  const rows = state.logs.filter(l=>l.date===date && (!shiftFilter || l.shift===shiftFilter));
  if(!rows.length){ showToast(t("noLogsToExport")); return false; }
  const body = rows.map(masterLogRow);
  const csv = [MASTER_LOG_HEADER, ...body].map(r=>r.map(csvEscape).join(",")).join("\n");
  const title = `Manufacturing_Log_${date}` + (shiftFilter ? `_${shiftFilter}` : "");
  downloadFile(`${title}.csv`, csv, "text/csv");
  // Once a shift's runs are safely downloaded, clear their scheduled-run entries out of the
  // Schedule tab (the log data itself lives on in "logs" — this only tidies the planning view
  // so it only shows what's still open/not yet completed).
  const doneScheduleIds = new Set(rows.filter(l=>l.scheduleId).map(l=>l.scheduleId));
  const toRemove = state.schedule.filter(s=>doneScheduleIds.has(s.id) && s.status==="Done");
  Promise.all(toRemove.map(s=>deleteDoc("schedule", s.id)));
  showToast(t("exportedToDrive"));
  return true;
}
function buildDriveExportCard(){
  const card = el("div",{class:"card"});

/* Trailing-30-day on-time delivery rate, using FILLCO's own definition: an order is on
   time when its first delivery is within 3 days of the order being entered (see
   onTimeRows / ON_TIME_DAYS). Orders whose first delivery — or whose missed 3-day
   deadline — falls inside the window are counted. Plus the quality flag rate: of every
   run with a logged quality check, what share failed "meets our standards". */
function computeOnTimeDeliveryRate(windowDays){
  const cutoff = shiftDateStr(todayStr(), -windowDays);
  const rows = onTimeRows().filter(r=>(r.first||r.deadline)>=cutoff);
  if(!rows.length) return null;
  return Math.round(rows.filter(r=>r.verdict==="onTime").length/rows.length*100);
}
function computeQualityFlagRate(){
  const checked = state.logs.filter(l=>l.quality && l.quality.standardsOk!=null);
  if(!checked.length) return null;
  const flagged = checked.filter(l=>l.quality.standardsOk===false).length;
  return Math.round((flagged/checked.length)*100);
}
function buildAccountabilityStatsCard(){
  const card = el("div",{class:"card"});
  const onTimePct = computeOnTimeDeliveryRate(30);
  const qFlagPct = computeQualityFlagRate();
  card.appendChild(el("div",{class:"grid-cards"},[
    statCard(t("onTimeRateLabel"),"%", onTimePct!=null? String(onTimePct) : "—"),
    statCard(t("qualityFlagRateLabel"),"%", qFlagPct!=null? String(qFlagPct) : "—"),
  ]));
  return card;
}

/* Per-operator accountability, last 14 days: how many runs, how their net kg/h
   compares on average to this app's own type+GSM+width benchmark, and how many
   stoppage minutes were logged against their runs — surfaces who/what is running
   behind, and by how much, without inventing any new data field. */
function buildOperatorAccountabilityCard(){
  const card = el("div",{class:"card"});
  card.appendChild(el("div",{class:"card-head"},[
    el("h2",{},[t("opAccountTitle")]),
    el("span",{class:"hint"},[t("opAccountHint")])
  ]));
  const cutoff = shiftDateStr(todayStr(), -14);
  const recentLogs = state.logs.filter(l=>l.date>=cutoff && l.operator);
  if(!recentLogs.length){
    card.appendChild(el("div",{class:"empty"},[t("opAccountNone")]));
    return card;
  }
  const byOp = new Map();
  recentLogs.forEach(l=>{
    const key = l.operator;
    if(!byOp.has(key)) byOp.set(key, {runs:0, diffSum:0, diffCount:0, stoppageMin:0});
    const agg = byOp.get(key);
    agg.runs++;
    agg.stoppageMin += Number(l.stoppageMinutes)||0;
    const netH = netRunHours(l);
    if(netH>0){
      const rate = netRateKgH(l);
      const bench = rateFor(l.productType, l.gsm, l.width, state.settings);
      if(bench>0){ agg.diffSum += (rate-bench)/bench; agg.diffCount++; }
    }
  });
  const rows = [...byOp.entries()].map(([op,agg])=>({
    op, runs:agg.runs, stoppageMin:agg.stoppageMin,
    avgDiffPct: agg.diffCount>0 ? (agg.diffSum/agg.diffCount)*100 : null
  })).sort((a,b)=>(a.avgDiffPct==null?0:a.avgDiffPct)-(b.avgDiffPct==null?0:b.avgDiffPct));
  const tw = el("div",{class:"table-wrap"});
  const tbl = el("table");
  tbl.appendChild(el("thead",{},[el("tr",{},[t("colOperator"),t("opAccountRuns"),t("opAccountAvgDiff"),t("opAccountStoppage")].map(h=>el("th",{},[h])))]));
  const tb = el("tbody");
  rows.forEach(r=>{
    const diffPill = r.avgDiffPct==null ? el("span",{class:"pill mute"},["—"])
      : el("span",{class:"pill "+(r.avgDiffPct>=0?"good":(Math.abs(r.avgDiffPct)>=10?"bad":"warn"))},[(r.avgDiffPct>=0?"+":"")+r.avgDiffPct.toFixed(0)+"%"]);
    tb.appendChild(el("tr",{},[
      el("td",{},[r.op]),
      el("td",{class:"num"},[String(r.runs)]),
      el("td",{},[diffPill]),
      el("td",{class:"num"},[fmt0(r.stoppageMin)+"m"]),
    ]));
  });
  tbl.appendChild(tb); tw.appendChild(tbl); card.appendChild(tw);
  return card;
}

/* The quality-check table, shared by the dashboard card (last working day) and an
   order's History (every check ever logged against that SO). */
function qaTable(checked){
  const rows = checked.map(l=>{
    const q = l.quality;
    const systemRate = netRateKgH(l);
    const diffPct = (q.supervisorRateKgH!=null && systemRate>0) ? ((q.supervisorRateKgH-systemRate)/systemRate)*100 : null;
    return {l,q,systemRate,diffPct};
  }).sort((a,b)=> Math.abs(b.diffPct||0) - Math.abs(a.diffPct||0));
  const tw = el("div",{class:"table-wrap"});
  const tbl = el("table");
  tbl.appendChild(el("thead",{},[el("tr",{},[
    t("colDate"),t("colSO"),t("colItem"),t("colGsmChecks"),t("colHeight"),t("colStandards"),t("colSupervisorRate"),t("colSystemRate"),t("colDiffPct")
  ].map(h=>el("th",{},[h])))]));
  const tb = el("tbody");
  rows.forEach(({l,q,systemRate,diffPct})=>{
    const gsmVals = [q.gsm1,q.gsm2,q.gsm3].filter(v=>v!=null);
    const diffPill = diffPct==null ? el("span",{class:"pill mute"},["—"])
      : el("span",{class:"pill "+(Math.abs(diffPct)>=10?"bad":Math.abs(diffPct)>=5?"warn":"good")},[(diffPct>=0?"+":"")+diffPct.toFixed(0)+"%"]);
    tb.appendChild(el("tr",{},[
      el("td",{},[l.date||"—"]),
      el("td",{class:"mono"},[l.so||"—"]),
      el("td",{},[`${l.productType||""} ${l.gsm||""}gsm`]),

/* ---- Loading: look up an SO, see every logged roll, check them off ---- */
function rollsLoadedForSo(so){
  const matchLogs = state.logs.filter(l=>sameSo(l.so, so));
  const allRolls = [];
  matchLogs.forEach(l=>{ (l.rolls||[]).forEach(r=> allRolls.push(Object.assign({}, r, {log:l}))); });
  return allRolls;
}
function shiftDateStr(dateStr, delta){
  return addDaysStr(dateStr, delta); // UTC-safe — the local-midnight version slipped a day in Cairo (UTC+3), so "+1 day" returned the same day
}
/* Where an order stands for loading/delivery, joined from orders + its produced rolls
   + any delivery slips already raised against its SO — drives the calendar's status pill. */
function loadingStatusForOrder(o){
  const rolls = rollsLoadedForSo(o.so);
  const producedQty = rolls.reduce((a,r)=>a+(Number(r.weightKg)||0),0);
  const slips = state.deliverySlips.filter(s=>sameSo(s.so, o.so));
  const deliveredQty = slips.reduce((a,s)=>a+(Number(s.totalWeightLoaded)||0),0);
  const allChecked = slips.length>0 && slips.every(s=>s.checked);
  let key, label;
  if(slips.length && allChecked){ key="delivered"; label=t("statusDelivered"); }
  else if(slips.length){ key="loaded"; label=t("statusLoadedPendingCheck"); }
  else if(o.qtyKg>0 && producedQty>=o.qtyKg*0.98){ key="ready"; label=t("statusReadyToLoad"); }
  else if(producedQty>0){ key="partial"; label=t("statusPartiallyProduced"); }
  else { key="notstarted"; label=t("statusNotStarted"); }
  const pillClass = {delivered:"good", loaded:"accent", ready:"warn", partial:"mute", notstarted:"mute"}[key];
  return {producedQty, deliveredQty, pillClass, label};
}

/* Spreads a checked-weight correction across a slip's own roll records, proportionally
   to each roll's current share of the total, with the last roll absorbing any rounding
   remainder so the rolls always sum EXACTLY to the corrected total. This is the single
   place a weight correction is turned into per-roll numbers — every surface that reports
   a slip's weight (the slip modal, the printed/downloaded slip, the delivery-slip history
   table, and the Loading tab's re-summed "checked weight" stat) reads the result of this,
   directly or via the rolls it updates, so they can never disagree again. */
function distributeWeightCorrection(rolls, newTotal){
  const list = rolls||[];
  const origTotal = list.reduce((a,r)=>a+(Number(r.weightKg)||0),0);
  if(!list.length) return list;
  if(origTotal<=0){
    // nothing to scale proportionally — split the new total evenly instead
    const even = Math.round((newTotal/list.length)*100)/100;
    let running = 0;
    return list.map((r,i)=>{
      const w = i===list.length-1 ? Math.round((newTotal-running)*100)/100 : even;
      running += w;
      return Object.assign({}, r, {weightKg:w});
    });
  }
  const factor = newTotal/origTotal;
  let running = 0;
  return list.map((r,i)=>{
    let w;
    if(i===list.length-1){ w = Math.round((newTotal-running)*100)/100; }
    else{ w = Math.round((Number(r.weightKg)||0)*factor*100)/100; running += w; }
    return Object.assign({}, r, {weightKg:w});
  });
}

/* Groups a slip's rolls into distinct product/GSM/width lines — usually just one, but
   more than one when the slip merges rolls from runs that used a different GSM/width
   for the same SO (see the duplicate-SO merge decision in the Loading tab). */
function slipProductLines(slip){
  const groups = new Map();
  (slip.rolls||[]).forEach(r=>{
    // older slips didn't store the item on each roll — fall back to the roll's source log
    const log = (!r.productType) ? state.logs.find(l=>l.id===r.logId) : null;
    const productType = r.productType || (log && log.productType) || "";
    const gsm = r.gsm || (log && log.gsm) || null, width = r.width || (log && log.width) || null;
    const key = productType+"|"+(gsm||"")+"|"+(width||"");
    if(!groups.has(key)) groups.set(key, {productType, gsm, width, weightKg:0, rollCount:0});
    const g = groups.get(key);
    g.weightKg += Number(r.weightKg)||0;
    g.rollCount += 1;
  });
  return [...groups.values()];
}
/* A human-readable reference number for the slip, in the spirit of a real ERP
   delivery reference (e.g. Odoo's "MWH/OUT/03349"). New slips carry a real running
   sequence number (slip.slipSeq), padded to 5 digits. On this backend that number
   is claimed inside the same SQLite transaction that creates the slip (see
   POST /api/delivery-slips, and claimNextSlipSeq in src/routes/deliverySlips.js) —
   a real transaction now, replacing the original Artifact app's cooperative
   acquire()-lease workaround around its own db capability's lack of transactions.
   (The backend also exposes a standalone POST /api/delivery-slips/claim-slip-number
   for claiming a number on its own; this app doesn't call it separately, since
   that would claim a second, unused number on top of the one POST
   /api/delivery-slips already claims atomically while creating the slip.)
   A slip generated before this existed has no slipSeq, so it keeps showing its
   original id-derived reference rather than being renumbered after the fact. */
function slipRefNumber(slip){
  if(slip.slipSeq!=null) return "FILLCO/OUT/"+String(slip.slipSeq).padStart(5,"0");
  const idPart = String(slip.id||"").replace(/^slip_/,"").toUpperCase();
  return "FILLCO/OUT/"+idPart;
}

/* Roll-by-roll detail for every item on a slip: each product/GSM/width line gets its own
   block listing every roll number with its weight (4 roll/weight pairs per row so a
   40-roll item stays compact when printed) and an item subtotal. Older slips that didn't
   store the item on each roll fall back to the roll's source production log. */
function slipRollDetailsHtml(slip){
  const groups = new Map();
  (slip.rolls||[]).forEach(r=>{
    const log = state.logs.find(l=>l.id===r.logId);
    const productType = r.productType || (log && log.productType) || "";
    const gsm = r.gsm || (log && log.gsm) || "";
    const width = r.width || (log && log.width) || "";
    const key = productType+"|"+gsm+"|"+width;
    if(!groups.has(key)) groups.set(key, {productType, gsm, width, rolls:[]});
    groups.get(key).rolls.push(r);
  });
  if(!groups.size) return "";
  const cell = "border:1px solid #cfd5c9;padding:4px 6px;font-size:11.5px;";
  const headCell = "border:1px solid #cfd5c9;padding:4px 6px;font-size:9.5px;text-transform:uppercase;letter-spacing:.04em;color:#5d675c;background:#eef0ec;";
  const PAIRS = 4;
  const blocks = [...groups.values()].map((g,gi)=>{
    const rolls = g.rolls.slice().sort((a,b)=>(Number(a.seq)||0)-(Number(b.seq)||0));
    const subtotal = rolls.reduce((a,r)=>a+(Number(r.weightKg)||0),0);
    const desc = `${g.productType||"—"} · ${g.gsm||"—"} GSM${g.width?(" · "+g.width+"cm"):""}`;
    const head = Array.from({length:PAIRS}).map(()=>`<th style="${headCell}text-align:left;">${esc(t("colRoll"))}</th><th style="${headCell}text-align:right;">kg</th>`).join("");
    let body = "";
    for(let i=0;i<rolls.length;i+=PAIRS){
      body += "<tr>"+Array.from({length:PAIRS}).map((_,k)=>{
        const r = rolls[i+k];
        return r ? `<td style="${cell}">${esc(r.seq||"—")}</td><td style="${cell}text-align:right;font-family:monospace;">${fmt1(Number(r.weightKg)||0)}</td>`
                 : `<td style="${cell}"></td><td style="${cell}"></td>`;
      }).join("")+"</tr>";
    }
    return `<div style="margin-top:14px;">
      <div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:12.3px;font-weight:700;margin-bottom:5px;">
        <span>${esc(t("itemWord"))} ${gi+1}: ${esc(desc)}</span>
        <span style="font-family:monospace;">${esc(t("itemSubtotal"))}: ${rolls.length} ${esc(t("colSlipRolls"))} · ${fmt1(subtotal)} kg</span>
      </div>
      <table style="width:100%;border-collapse:collapse;"><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table>
    </div>`;
  }).join("");
  return `<div style="margin-top:18px;">
    <div style="font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:#5d675c;font-weight:700;border-bottom:2px solid #1b241f;padding-bottom:5px;">${esc(t("slipRollDetails"))}</div>
    ${blocks}
  </div>`;
}
/* Rich HTML content shared by the on-screen slip modal, the print overlay, and the
   downloadable file, so all three always show exactly the same numbers. Styled after
   the shop's real ERP (Odoo) delivery slip: a light header band with a soft wave divider,
   an address block, a large reference number, an info bar (Order / Delivery date), and
   a product table with Product / Ordered / Delivered columns. */
function slipContentHtml(slip){
  const order = state.orders.find(o=>sameSo(o.so, slip.so));
  const lines = slipProductLines(slip);
  const rtl = state.lang==="ar";
  const addrAlign = rtl ? "left" : "right";
  const productRows = lines.map(g=>{
    const desc = `${g.productType||"—"} · ${g.gsm||"—"} GSM${g.width?(" · "+g.width+"cm"):""}`;
    const ordered = order && order.qtyKg!=null ? fmt0(order.qtyKg) : "—";
    return `<tr><td style="padding:8px 8px;border-bottom:1px solid #e2e6de;">${esc(desc)}</td>`+
      `<td style="padding:8px 8px;border-bottom:1px solid #e2e6de;text-align:right;font-family:monospace;">${ordered}</td>`+
      `<td style="padding:8px 8px;border-bottom:1px solid #e2e6de;text-align:right;font-family:monospace;">${fmt1(g.weightKg)}</td></tr>`;
  }).join("");
  const checkedLine = slip.checked
    ? `<div style="margin-top:12px;font-size:11.5px;color:#5d675c;">${esc(t("checkedByLabel",{name:slip.checkedBy||"—", date:(slip.checkedAt||"").slice(0,10)}))} — ${esc(t("checkedWeightLabel"))}: ${fmt1(slip.checkedWeight)}</div>`
    : "";
  const refNo = slipRefNumber(slip);
  return `<div style="font-family:'IBM Plex Sans',Arial,Helvetica,sans-serif;color:#1b241f;max-width:720px;margin:0 auto;background:#fff;">
  <div style="position:relative;background:#eef0ec;padding:20px 26px 30px;overflow:hidden;">
    <div style="position:relative;z-index:1;display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;">
      <div style="font-size:12.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#5d675c;">${esc(t("slipTitle"))}</div>
      <img src="${LOGO_DATA_URI}" alt="FILLCO" style="height:32px;width:auto;display:block;">
    </div>
    <svg viewBox="0 0 720 26" preserveAspectRatio="none" style="position:absolute;left:0;right:0;bottom:-1px;width:100%;height:26px;display:block;">
      <path d="M0,14 C120,26 240,0 360,13 C480,26 600,0 720,13 L720,26 L0,26 Z" fill="#ffffff"></path>
    </svg>
  </div>
  <div style="padding:2px 26px 22px;">
    <div style="text-align:${addrAlign};margin:12px 0 18px;font-size:12.3px;color:#5d675c;">
      <div style="font-weight:700;color:#1b241f;font-size:12.8px;">${esc(t("slipAddressLabel"))}:</div>
      <div>${esc(custDisplay(slip.customer)||"—")}</div>
    </div>
    <h1 style="font-size:21px;margin:0 0 16px;font-family:'IBM Plex Mono',monospace;letter-spacing:.02em;">${esc(refNo)}</h1>
    <div style="display:flex;gap:26px;background:#e2e6de;border-radius:8px;padding:10px 14px;margin-bottom:16px;flex-wrap:wrap;">
      <div><div style="font-size:10px;text-transform:uppercase;letter-spacing:.04em;color:#5d675c;">${esc(t("slipSo"))}</div><div style="font-weight:700;font-family:monospace;">${esc(slip.so||"—")}</div></div>
      <div><div style="font-size:10px;text-transform:uppercase;letter-spacing:.04em;color:#5d675c;">${esc(t("deliveryDate"))}</div><div style="font-weight:700;">${esc(slip.deliveryDate||"—")}</div></div>
      <div><div style="font-size:10px;text-transform:uppercase;letter-spacing:.04em;color:#5d675c;">${esc(t("slipDriver"))}</div><div style="font-weight:700;">${esc(slip.driver||"—")}</div></div>
    </div>
    <table style="width:100%;border-collapse:collapse;margin-bottom:4px;">
      <thead><tr>
        <th style="text-align:left;border-bottom:2px solid #1b241f;padding:6px 8px;font-size:10.5px;text-transform:uppercase;letter-spacing:.04em;color:#5d675c;">${esc(t("colItem"))}</th>
        <th style="text-align:right;border-bottom:2px solid #1b241f;padding:6px 8px;font-size:10.5px;text-transform:uppercase;letter-spacing:.04em;color:#5d675c;">${esc(t("calQtyOrdered"))}</th>
        <th style="text-align:right;border-bottom:2px solid #1b241f;padding:6px 8px;font-size:10.5px;text-transform:uppercase;letter-spacing:.04em;color:#5d675c;">${esc(t("calQtyDelivered"))}</th>
      </tr></thead>
      <tbody>${productRows}</tbody>
      <tfoot><tr>
        <td style="padding:9px 8px;font-weight:700;">${esc(t("slipTotalRolls"))}: ${slip.rollCount}</td>
        <td></td>
        <td style="text-align:right;padding:9px 8px;font-weight:700;font-family:monospace;">${fmt1(slip.totalWeightLoaded)} kg</td>
      </tr></tfoot>
    </table>
    ${slipRollDetailsHtml(slip)}
    ${checkedLine}
    <div style="margin-top:22px;border-top:1px solid #cfd5c9;padding-top:8px;font-size:10.3px;color:#5d675c;">${esc(refNo)} · ${esc(slip.deliveryDate||"—")}</div>
  </div>
</div>`;
}

/* Builds a print-only overlay (hidden on screen, shown only under @media print) and
   triggers the browser's print dialog. */
function printSlipNow(slip){
  const existing = document.getElementById("printSlipRoot"); if(existing) existing.remove();
  const root = el("div",{id:"printSlipRoot", class:"print-slip", html: slipContentHtml(slip)});
  document.body.appendChild(root);
  const cleanup = ()=>{ root.remove(); window.removeEventListener("afterprint", cleanup); };
  window.addEventListener("afterprint", cleanup);
  window.print();
}

function downloadSlipNow(slip){
  const dirAttr = state.lang==="ar" ? ' dir="rtl"' : "";
  const html = `<!doctype html><html${dirAttr}><head><meta charset="utf-8"><title>${esc(t("slipTitle"))} — ${esc(slip.so)}</title><style>body{margin:0;padding:24px;background:#eef0ec;font-family:'IBM Plex Sans',Arial,sans-serif;}</style></head><body>${slipContentHtml(slip)}</body></html>`;
  downloadFile(`delivery-slip-${slip.so}-${slip.deliveryDate}.html`, html, "text/html");
}

/* The slip modal: view any slip (just generated, or from the history list), print or
   download it, and — for a checker — confirm a checked weight. If the checked weight
   differs from what was recorded as loaded, the loaded amount is updated to match. */
function openSlipModal(slip){
  const backdrop = el("div",{class:"modal-backdrop", onclick:(e)=>{ if(e.target===backdrop) closeModal(); }});
  const modal = el("div",{class:"modal", style:"max-width:760px;"});
  modal.appendChild(el("h3",{},[t("reviewSlip")]));
  const body = el("div",{html: slipContentHtml(slip)});
  modal.appendChild(body);

  const editGrid = el("div",{class:"form-grid", style:"margin-top:14px;"});
  const driverInp = inputEl("text","",t("driverName"),{value: slip.driver||""});
  const dateInp = inputEl("date","",t("deliveryDate"),{value: slip.deliveryDate||todayStr()});
  const checkedInp = inputEl("number","",t("checkedWeightLabel"),{step:"0.01", value: slip.checkedWeight!=null? slip.checkedWeight : slip.totalWeightLoaded});
  editGrid.appendChild(fieldWrap(t("driverName"), driverInp));
  editGrid.appendChild(fieldWrap(t("deliveryDate"), dateInp));
  editGrid.appendChild(fieldWrap(t("checkedWeightLabel"), checkedInp));
  modal.appendChild(editGrid);
  modal.appendChild(el("div",{class:"hint", style:"font-size:11.5px; color:var(--text-mute); margin-top:4px;"},[t("checkedWeightHint")]));

  const actions = el("div",{class:"form-actions", style:"grid-column:1/-1; flex-wrap:wrap;"},[
    el("button",{class:"btn ghost", type:"button", onclick:()=>printSlipNow(slip)},[t("printSlipBtn")]),
    el("button",{class:"btn ghost", type:"button", onclick:()=>downloadSlipNow(slip)},[t("downloadSlip")]),
    el("button",{class:"btn ghost", style:"color:var(--bad);", type:"button"},[t("deleteSlip")]),
    el("button",{class:"btn ghost", type:"button", onclick:closeModal},[t("cancel")]),
    el("button",{class:"btn", type:"button"},[t("saveCheck")]),
  ]);
  modal.appendChild(actions);
  const deleteBtn = actions.children[2];
  const saveBtn = actions.lastChild;
  deleteBtn.addEventListener("click", ()=>{
    confirmAction(t("deleteSlipConfirm"), async ()=>{
      // DELETE /api/delivery-slips/:id reverts the rolls (frees them up to load
      // again) server-side; mirror that locally too so the Loading tab doesn't
      // need a round trip to show it immediately.
      await deleteDoc("deliverySlips", slip.id);
      patchLogsRollsRevert(slip);
      render();
      closeModal();
    });
  });
  saveBtn.addEventListener("click", async ()=>{
    const checkedWeight = Number(checkedInp.value)||0;
    // PUT /api/delivery-slips/:id does the weight-correction redistribution itself
    // (the same proportional-split algorithm as distributeWeightCorrection above),
    // across both the slip's own roll snapshot and the underlying roll rows, in one
    // transaction — see src/routes/deliverySlips.js. The response is the
    // authoritative, already-corrected slip.
    const updated = await updateDoc("deliverySlips", slip.id, {
      driver: driverInp.value||"—", deliveryDate: dateInp.value||slip.deliveryDate,
      checked:true, checkedWeight, checkedBy: state.viewerName||"",
    });
    if(updated){
      patchLogsRollsFromSlip(updated);
      render();
      const diff = Number(updated.weightDiff)||0;
      if(Math.abs(diff)>0.01) showToast(t("weightDiffFlag",{diff: fmt1(Math.abs(diff))}));
    }
    closeModal();
  });

  backdrop.appendChild(modal);
  document.getElementById("modalRoot").appendChild(backdrop);
}

function statCard(label,unit,value){
  return el("div",{class:"stat"},[
    el("div",{class:"label"},[label]),
    el("div",{class:"value"},[value + (unit?" "+unit:"")]),
  ]);

/* Editable list of per-roll weights for a log entry. Returns {wrap, getRolls(), reset()}.
   When at least one roll has a weight, the form's actualQtyKg field is auto-summed and locked;
   with zero rolls it stays freely editable (backward compatible with ad-hoc logging). */
function buildRollsSection(form, existingRolls){
  const wrap = el("div",{class:"card", style:"grid-column:1/-1; background:var(--bg-soft,#f7f8fa); padding:10px 12px; border-radius:10px; margin:2px 0;"});
  wrap.appendChild(el("div",{style:"display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:6px;"},[
    el("strong",{style:"font-size:12.5px;"},[t("rollsSectionTitle")]),
    el("span",{class:"hint"},[t("rollsSectionHint")])
  ]));
  // Grid of 10 columns so roll-weight boxes sit ten to a row, next to each other.
  const list = el("div",{class:"rolls-list", style:"display:grid; grid-template-columns:repeat(10, minmax(56px,1fr)); gap:5px;"});
  wrap.appendChild(list);
  const addBtn = el("button",{class:"btn ghost sm", type:"button", style:"margin-top:6px;"},[t("addRoll")]);
  wrap.appendChild(addBtn);
  const totalLine = el("div",{class:"hint", style:"margin-top:6px;"});
  wrap.appendChild(totalLine);

  let rolls = (existingRolls && existingRolls.length)
    ? existingRolls.map(r=>({id:r.id||uid("r"), weightKg:(r.weightKg!=null?r.weightKg:""), checked:!!r.checked, checkedAt:r.checkedAt||null, checkedBy:r.checkedBy||"", note:r.note||""}))
    // Opens pre-populated with 10 empty roll boxes for a fresh run; "+ Add 10 rolls" adds ten more at a time.
    : Array.from({length:10},()=>({id:uid("r"), weightKg:"", checked:false, checkedAt:null, checkedBy:"", note:""}));

  function qtyInput(){ return form.querySelector('[name="actualQtyKg"]'); }

  function syncTotal(){
    const withWeight = rolls.filter(r=>r.weightKg!=="" && r.weightKg!=null);
    const sum = withWeight.reduce((a,r)=>a+(Number(r.weightKg)||0),0);
    const qi = qtyInput();
    if(withWeight.length>0){
      totalLine.textContent = t("rollsTotalLabel",{count:withWeight.length, kg:(Math.round(sum*100)/100).toLocaleString()});
      if(qi){ qi.value = Math.round(sum*100)/100; qi.readOnly = true; qi.style.background = "var(--bg-soft,#eef1f5)"; }
    } else {
      totalLine.textContent = "";
      if(qi){ qi.readOnly = false; qi.style.background = ""; }
    }
  }
  function renderRows(){
    list.innerHTML = "";
    rolls.forEach((r,i)=>{
      const row = el("div",{style:"display:flex;flex-direction:column;gap:2px;"});
      const head = el("div",{style:"display:flex;justify-content:space-between;align-items:center;"},[
        el("span",{style:"font-size:9.5px;color:var(--text-mute);"},[String(i+1)]),
        el("button",{class:"close-x", type:"button", style:"font-size:12px;padding:0 2px;"},["✕"])
      ]);
      head.lastChild.addEventListener("click", ()=>{ rolls.splice(i,1); renderRows(); });
      row.appendChild(head);
      const inp = el("input",{type:"number", step:"0.01", min:"0", placeholder:t("rollWeightPlaceholder"), style:"padding:5px 6px;"});
      inp.value = r.weightKg;
      inp.addEventListener("input", ()=>{ r.weightKg = inp.value; syncTotal(); });
      row.appendChild(inp);
      list.appendChild(row);
    });
    syncTotal();
  }
  addBtn.addEventListener("click", ()=>{
    for(let i=0;i<10;i++) rolls.push({id:uid("r"), weightKg:"", checked:false, checkedAt:null, checkedBy:"", note:""});
    renderRows();
  });
  renderRows();

  function getRolls(){
    return rolls
      .filter(r=>r.weightKg!=="" && r.weightKg!=null && Number(r.weightKg)>0)
      .map((r,i)=>({id:r.id, seq:i+1, weightKg:Number(r.weightKg), checked:!!r.checked, checkedAt:r.checkedAt||null, checkedBy:r.checkedBy||"", note:r.note||""}));
  }
  function reset(){ rolls = Array.from({length:10},()=>({id:uid("r"), weightKg:"", checked:false, checkedAt:null, checkedBy:"", note:""})); renderRows(); }
  return {wrap, getRolls, reset};
}

/* Optional quality section: 3 GSM spot-checks + a height check + a standards-met checkbox,
   plus the supervisor's own kg/h reading so it can be compared against the system's own
   net kg/h calculation for that run (surfaced together on the Dashboard's QA card). */
function buildQualitySection(existingQuality){
  const q = existingQuality || {};
  const wrap = el("div",{class:"card", style:"grid-column:1/-1; background:var(--bg-soft,#f7f8fa); padding:10px 12px; border-radius:10px; margin:2px 0;"});
  wrap.appendChild(el("div",{style:"display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:6px;"},[
    el("strong",{style:"font-size:12.5px;"},[t("qualitySectionTitle")]),
    el("span",{class:"hint"},[t("qualitySectionHint")])
  ]));
  const grid = el("div",{class:"form-grid"});
  const gsm1 = inputEl("number","",t("gsm"),{step:"0.01",value:q.gsm1!=null?q.gsm1:""});
  const gsm2 = inputEl("number","",t("gsm"),{step:"0.01",value:q.gsm2!=null?q.gsm2:""});
  const gsm3 = inputEl("number","",t("gsm"),{step:"0.01",value:q.gsm3!=null?q.gsm3:""});
  grid.appendChild(fieldWrap(t("gsmCheck",{n:1}), gsm1));
  grid.appendChild(fieldWrap(t("gsmCheck",{n:2}), gsm2));
  grid.appendChild(fieldWrap(t("gsmCheck",{n:3}), gsm3));
  const heightInp = inputEl("number","",t("heightCheckCm"),{step:"0.01",value:q.heightCm!=null?q.heightCm:""});
  grid.appendChild(fieldWrap(t("heightCheckCm"), heightInp));
  const rateInp = inputEl("number","",t("supervisorRateKgH"),{step:"0.01",value:q.supervisorRateKgH!=null?q.supervisorRateKgH:""});
  grid.appendChild(fieldWrap(t("supervisorRateKgH"), rateInp));
  const standardsChk = el("input",{type:"checkbox"});
  if(q.standardsOk) standardsChk.setAttribute("checked","checked");
  const chkLabel = el("label",{style:"flex-direction:row; align-items:center; gap:6px;"},[standardsChk, document.createTextNode(t("meetsStandards"))]);
  grid.appendChild(chkLabel);
  wrap.appendChild(grid);

  function getQuality(){
    const vals = {
      gsm1: gsm1.value!==""?Number(gsm1.value):null,
      gsm2: gsm2.value!==""?Number(gsm2.value):null,
      gsm3: gsm3.value!==""?Number(gsm3.value):null,
      heightCm: heightInp.value!==""?Number(heightInp.value):null,
      supervisorRateKgH: rateInp.value!==""?Number(rateInp.value):null,
      standardsOk: standardsChk.checked,
    };
    const anySet = vals.gsm1!=null || vals.gsm2!=null || vals.gsm3!=null || vals.heightCm!=null || vals.supervisorRateKgH!=null || standardsChk.checked;
    return anySet ? vals : null;
  }
  return {wrap, getQuality};
}

function buildLogForm(){

  const adHocOpt = t("adHocOption");

      const remaining = Math.max((Number(schedule.plannedQtyKg)||0)-loggedKg,0);

  }
  soInput.addEventListener("input", ()=>{
    const order = state.orders.find(o=>o.so===soInput.value.trim());
    if(order) applyOrder(order); else showOrderInfo(null);
  });

  // selecting a scheduled run fills everything immediately, including its order's notes
  // and the quantity that was originally ordered (plus what's planned/logged for this run)
  scheduleSel.addEventListener("change", ()=>{
    const s = state.schedule.find(x=>x.id===Number(scheduleSel.value));
    if(!s){ showOrderInfo(null); return; }

    form.querySelector('[name="shift"]').value = s.shift;

    const order = state.orders.find(o=>o.id===s.orderId) || state.orders.find(o=>o.so===s.so);

  // auto-compute hours from start/end clock times (handles an evening shift crossing midnight)

  const hoursInp = form.querySelector('[name="actualHours"]');
  function syncHours(){
    const h = hoursBetween(startInp.value, endInp.value);
    if(h!=null) hoursInp.value = Math.round(h*100)/100;
  }
  startInp.addEventListener("change", syncHours);
  endInp.addEventListener("change", syncHours);

  form.addEventListener("submit", async (e)=>{
    e.preventDefault();
    const fd = new FormData(form);
    const schedIdRaw = fd.get("scheduleId");
    const schedId = schedIdRaw ? Number(schedIdRaw) : null; // <select> values are always strings — the schedule row's own id is numeric
    let entry = {
      date: todayStr(),

      width: Number(fd.get("width"))||null,

      startTime: fd.get("startTime")||"", endTime: fd.get("endTime")||"",
      stoppageMinutes: Number(fd.get("stoppageMinutes"))||0, stoppageCategory: fd.get("stoppageCategory")||"",
      operator: fd.get("operator")||"", notes: fd.get("notes")||"", loggedAt: new Date().toISOString(),
      rolls: rollsSection.getRolls(),
      quality: qualitySection.getQuality(),
    };
    if(schedId){

      if(s){ entry.so = s.so; entry.productType = s.productType; entry.gsm = s.gsm; entry.width = s.width; entry.line = s.line; entry.shift = s.shift; }
    }
    await addDoc("logs", entry);
    if(schedId){
      await syncScheduleStatus(schedId, {id:null, actualQtyKg: entry.actualQtyKg, startTime: entry.startTime, endTime: entry.endTime});
    }
    form.reset();
    rollsSection.reset();
    orderInfo.hidden = true;
  });
  return form;
}
function hoursBetween(start,end){
  if(!start || !end) return null;
  const [sh,sm] = start.split(":").map(Number);
  const [eh,em] = end.split(":").map(Number);
  let startMin = sh*60+sm, endMin = eh*60+em;
  if(endMin <= startMin) endMin += 24*60; // crossed midnight — normal for the evening shift
  return (endMin-startMin)/60;
}

        tb.appendChild(el("tr",{},[

          el("td",{},[`${l.productType||""} ${l.gsm||""}gsm${l.width?(" · "+l.width+"cm"):""}`]),
          el("td",{class:"num"},[fmt0(l.actualQtyKg)]),

          el("td",{},[l.stoppageMinutes? fmt0(l.stoppageMinutes)+"m" : "—"]),
          el("td",{},[l.operator||"—"]),
        ]));
      });
      tbl.appendChild(tb); tw.appendChild(tbl); body.appendChild(tw);
      section.appendChild(body);

  async function runHistorySearch(){
    if(!db){ showToast(t("previewNoSync")); return; }
    searchBtn.disabled = true;

    try{
      const from = fromInp.value || shiftDateStr(todayStr(),-7);

function nextSeq(date,line,shift){
  const group = state.schedule.filter(s=>s.date===date && s.line===line && s.shift===shift);
  return group.length ? Math.max(...group.map(s=>s.seq ?? 0)) + 1 : 0;
}
/* Cursor drag-and-drop reordering within one line/shift group (native HTML5 drag). */
function attachDragReorder(tbody, entries){
  let dragIndex = null;
  Array.from(tbody.children).forEach((row,i)=>{
    row.draggable = true;
    row.addEventListener("dragstart",(e)=>{
      dragIndex = i; row.classList.add("dragging");
      e.dataTransfer.effectAllowed = "move";
      try{ e.dataTransfer.setData("text/plain", String(i)); }catch(err){}
    });
    row.addEventListener("dragend",()=>{ row.classList.remove("dragging"); Array.from(tbody.children).forEach(r=>r.classList.remove("drag-over")); });
    row.addEventListener("dragover",(e)=>{ e.preventDefault(); e.dataTransfer.dropEffect = "move"; row.classList.add("drag-over"); });
    row.addEventListener("dragleave",()=>{ row.classList.remove("drag-over"); });
    row.addEventListener("drop", async (e)=>{
      e.preventDefault(); row.classList.remove("drag-over");
      const dropIndex = i;
      if(dragIndex===null || dragIndex===dropIndex) return;
      const reordered = entries.slice();
      const [moved] = reordered.splice(dragIndex,1);
      reordered.splice(dropIndex,0,moved);
      const updates = [];
      reordered.forEach((entry,idx)=>{ if((entry.seq ?? 0)!==idx) updates.push(updateDoc("schedule", entry.id, {seq: idx})); });
      dragIndex = null;
      await Promise.all(updates);
    });
  });
}
function statusPill(status){
  const map = {"Planned":"mute","Running":"accent","Done":"good","Skipped":"bad","Partially Done":"warn","Open":"mute","Scheduled":"accent","In Progress":"accent","Complete":"good","Partially Complete":"warn","On Hold":"warn"};
  return el("span",{class:"pill "+(map[status]||"mute")},[statusLabel(status||"Planned")]);
}

}
