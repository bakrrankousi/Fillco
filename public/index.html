/* ---- Capacity ---- */
/* Work nobody has put on the schedule yet: every Open order in full, plus what a
   Partially-complete order still owes once none of its runs are left active on the schedule. */
function unscheduledDemand(){
  const items = [];
  state.orders.forEach(o=>{
    if(o.status==="Open"){ items.push({o, qty:Number(o.qtyKg)||0}); return; }
    if(o.status==="Partially Complete"){
      const active = state.schedule.some(s=>s.orderId===o.id && s.status!=="Done" && s.status!=="Skipped");
      if(active) return;
      const produced = logsForOrder(o).reduce((a,l)=>a+(Number(l.actualQtyKg)||0),0);
      const rem = Math.max((Number(o.qtyKg)||0)-produced, 0);
      if(rem>0) items.push({o, qty:rem});
    }
  });
  return items.map(it=>{
    const rate = rateFor(it.o.productType, it.o.gsm, it.o.width, state.settings);
    return Object.assign(it, {hrs: rate>0 ? it.qty/rate : 0});
  });
}
function capBar(pct){
  const cls = pct>100 ? "over" : pct>85 ? "warn" : "";
  return el("div",{class:"bar-track"},[el("div",{class:"bar-fill "+cls, style:`width:${Math.min(pct,100)}%`})]);
}
function viewCapacity(){
  const wrap = el("div",{class:"view"});
  const today = todayStr();
  const rows = computeCapacity(null);
  const scheduledRows = rows.filter(r=>r.entries.length>0);
  const scheduledHrs = scheduledRows.reduce((a,r)=>a+r.plannedHours,0);

  // planning window: today → the furthest of the last active scheduled run / last open due date
  // (at least a week, at most 60 days), every line × shift in it counted as available time
  let end = addDaysStr(today,6);
  state.schedule.forEach(s=>{ if(s.status!=="Done" && s.status!=="Skipped" && s.date>end) end = s.date; });
  state.orders.forEach(o=>{ if(o.status!=="Complete" && o.dueDate && o.dueDate>end) end = o.dueDate; });
  const maxEnd = addDaysStr(today,60); if(end>maxEnd) end = maxEnd;
  // only count lines that are actually running (used in the schedule or a log in the last 30
  // days) — an idle line on the settings list would otherwise double the "available" hours
  const since = addDaysStr(today,-30);
  const usedLines = new Set([...state.schedule.filter(s=>s.date>=since).map(s=>s.line), ...state.logs.filter(l=>l.date>=since).map(l=>l.line)]);
  const activeLines = state.settings.lines.filter(l=>usedLines.has(l));
  const capLines = activeLines.length ? activeLines : state.settings.lines;
  let availableHrs = 0;
  for(let d=today; d<=end; d=addDaysStr(d,1)){
    capLines.forEach(line=>{ SHIFTS.forEach(sh=>{
      const r = rows.find(x=>x.date===d && x.line===line && x.shift===sh.id);
      availableHrs += r ? r.effective : sh.hours;
    }); });
  }
  const freeHrs = Math.max(availableHrs - scheduledHrs, 0);
  const demand = unscheduledDemand();
  const backlogHrs = demand.reduce((a,d)=>a+d.hrs,0);

  // ---- overview: the two numbers side by side ----
  const overview = el("div",{class:"card"});
  overview.appendChild(el("div",{class:"card-head"},[
    el("h2",{},[t("capOverviewTitle")]),
    el("span",{class:"hint"},[`${t("capOverviewHint")} · ${capLines.join(", ")} · ${fmtDateHeading(today)} → ${fmtDateHeading(end)}`])
  ]));
  overview.appendChild(el("div",{class:"grid-cards"},[
    statCard(t("capAvailableHrs"),"h", fmt0(availableHrs)),
    statCard(t("capScheduledHrs"),"h", fmt1(scheduledHrs)),
    statCard(t("capFreeHrs"),"h", fmt1(freeHrs)),
    statCard(t("capBacklogHrs"),"h", fmt1(backlogHrs)),
  ]));
  const schedPct = availableHrs>0 ? scheduledHrs/availableHrs*100 : 0;
  const backlogPct = freeHrs>0 ? backlogHrs/freeHrs*100 : (backlogHrs>0 ? 999 : 0);
  const barsBox = el("div",{style:"margin-top:12px;"});
  barsBox.appendChild(el("div",{class:"cap-row"},[
    el("div",{class:"who"},[t("capScheduledHrs"), el("span",{class:"sub"},[`${fmt1(scheduledHrs)}h / ${fmt0(availableHrs)}h`])]),
    capBar(schedPct), el("div",{class:"pct"},[schedPct.toFixed(0)+"%"]),
  ]));
  barsBox.appendChild(el("div",{class:"cap-row"},[
    el("div",{class:"who"},[t("capBacklogHrs"), el("span",{class:"sub"},[`${fmt1(backlogHrs)}h / ${fmt1(freeHrs)}h`])]),
    capBar(backlogPct), el("div",{class:"pct"},[(backlogPct>=999?"—":backlogPct.toFixed(0)+"%")]),
  ]));
  overview.appendChild(barsBox);
  if(backlogHrs>0){
    const fits = backlogHrs <= freeHrs;
    overview.appendChild(el("div",{class:"pill "+(fits?"good":"bad"), style:"margin-top:10px; white-space:normal;"},[
      fits ? t("capBacklogFits",{pct: backlogPct.toFixed(0)}) : t("capBacklogOver",{over: fmt1(backlogHrs-freeHrs)})
    ]));
  }
  wrap.appendChild(overview);

  const summaryCard = el("div",{class:"card"});
  summaryCard.appendChild(el("div",{class:"card-head"},[
    el("h2",{},[t("capScheduledTitle")]),
    el("span",{class:"hint"},[t("capacityHint",{min:state.settings.changeoverMin})])
  ]));
  if(!scheduledRows.length){
    summaryCard.appendChild(el("div",{class:"empty"},[t("nothingOutstanding")]));
  } else {
    const list = el("div");
    scheduledRows.forEach(r=>{
      const pct = r.util*100;
      const row = el("div",{class:"cap-row"},[
        el("div",{class:"who"},[`${r.line}`, el("span",{class:"sub"},[`${fmtDateHeading(r.date)} · ${shiftLabelFor(r.shift)} · ${fmt1(r.plannedHours)}h / ${fmt1(r.effective)}h`])]),
        capBar(pct),
        el("div",{class:"pct"},[pct.toFixed(0)+"%"]),
      ]);
      row.title = `${fmt1(r.plannedHours)}h remaining of ${fmt1(r.effective)}h effective (${fmt1(r.available)}h shift − ${fmt1(r.changeoverLoss)}h changeover)`;
      list.appendChild(row);
    });
    summaryCard.appendChild(list);
    summaryCard.appendChild(el("div",{class:"legend", style:"margin-top:12px;"},[
      el("span",{},[el("span",{class:"sw",style:"background:var(--accent)"}),t("legendUnder")]),
      el("span",{},[el("span",{class:"sw",style:"background:var(--warn)"}),t("legendTight")]),
      el("span",{},[el("span",{class:"sw",style:"background:var(--bad)"}),t("legendOver")]),
    ]));
  }
  wrap.appendChild(summaryCard);

  // demand vs capacity by product type
  const demandCard = el("div",{class:"card"});
  demandCard.appendChild(el("div",{class:"card-head"},[el("h2",{},[t("capUnscheduledTitle")]), el("span",{class:"hint"},[t("unscheduledBacklog")])]));
  if(!demand.length){
    demandCard.appendChild(el("div",{class:"empty"},[t("noBacklog")]));
  } else {
    const byType = {};
    demand.forEach(({o,qty,hrs})=>{
      const agg = byType[o.productType] || {qty:0, hrs:0};
      agg.qty += qty; agg.hrs += hrs;
      byType[o.productType] = agg;
    });
    const maxQty = Math.max(...Object.values(byType).map(v=>v.qty),1);
    const list = el("div");
    Object.entries(byType).sort((a,b)=>b[1].qty-a[1].qty).forEach(([type,agg])=>{
      const row = el("div",{class:"cap-row"},[
        el("div",{class:"who"},[type, el("span",{class:"sub"},[`${fmt0(agg.qty)} kg · ~${fmt1(agg.hrs)}h ${t("neededSuffix")}`])]),
        el("div",{class:"bar-track"},[el("div",{class:"bar-fill", style:`width:${(agg.qty/maxQty*100).toFixed(0)}%`})]),
        el("div",{class:"pct"},[fmt0(agg.qty)+" kg"]),
      ]);
      list.appendChild(row);
    });
    demandCard.appendChild(list);
  }
  wrap.appendChild(demandCard);
  return wrap;
}

/* Everything that happened to one order, in one place: the runs that produced it, every
   quality check logged against its SO (this is where QA history lives once it drops off the
   dashboard), and the delivery slips that shipped it. */
function logsForOrder(order){
  const schedIds = new Set(state.schedule.filter(s=>s.orderId===order.id).map(s=>s.id));
  return state.logs.filter(l=> sameSo(l.so, order.so) || (l.scheduleId && schedIds.has(l.scheduleId)));
}

      data.status = "Scheduled";
      const orderId = await addDocWithId("orders", data);
      const rate = rateFor(data.productType, data.gsm, data.width, state.settings);
      const date = schedDateInp.value || todayStr(), line = schedLineSel.value, shift = schedShiftSel.value;
      await addDoc("schedule", {
        date, line, shift, orderId, so: data.so, customer: data.customer,
        productType: data.productType, gsm: data.gsm, width: data.width,
        plannedQtyKg: data.qtyKg, rateKgH: rate, plannedHours: rate>0 ? data.qtyKg/rate : 0,
        operator: "", status: "Planned", notes: "", seq: nextSeq(date,line,shift)
      });
    } else {
      await addDoc("orders", data);
    }
    closeModal();
  });
  modal.appendChild(form);
  backdrop.appendChild(modal);
  document.getElementById("modalRoot").appendChild(backdrop);
}

/* ---- Settings ---- */
function viewSettings(){
  const wrap = el("div",{class:"view two-col"});

  const leftCard = el("div",{class:"card"});
  leftCard.appendChild(el("div",{class:"card-head"},[el("h2",{},[t("shiftLineSetup")])]));
  const form = el("div",{class:"form-grid"});
  form.appendChild(fieldWrap(t("prodLinesCsv"), inputEl("text","linesInput","", {value: state.settings.lines.join(", ")})));
  form.appendChild(fieldWrap(t("changeoverLossMin"), inputEl("number","changeoverMin","", {value: state.settings.changeoverMin})));
  const saveBtn = el("button",{class:"btn sm", style:"grid-column:1/-1; justify-self:start;"},[t("save")]);
  form.appendChild(saveBtn);
  leftCard.appendChild(form);
  leftCard.appendChild(el("div",{class:"section-title",style:"margin-top:16px;"},[t("shiftsFixed")]));
  const shiftList = el("div");
  SHIFTS.forEach(s=> shiftList.appendChild(el("div",{class:"cap-row", style:"grid-template-columns:110px 1fr;"},[
    el("div",{class:"who"},[shiftLabelFor(s.id)]), el("div",{},[s.window+" · "+s.hours+"h"])
  ])));
  leftCard.appendChild(shiftList);
  saveBtn.addEventListener("click", async ()=>{
    const lines = form.querySelector('[name="linesInput"]').value.split(",").map(s=>s.trim()).filter(Boolean);
    const changeoverMin = Number(form.querySelector('[name="changeoverMin"]').value)||45;
    await saveSettings({lines: lines.length?lines:LINES, changeoverMin});
  });

  const rightCard = el("div",{class:"card"});
  rightCard.appendChild(el("div",{class:"card-head"},[el("h2",{},[t("rateBenchmarks")]), el("span",{class:"hint"},[t("rateBenchmarksHint")])]));
  const rateForm = el("div");
  const rates = state.settings.rates;
  const rateRows = Object.entries(rates).sort();
  const tbl = el("table");
  tbl.appendChild(el("thead",{},[el("tr",{},[t("colTypeGsmWidth"),t("colKgH"),""].map(h=>el("th",{},[h])))]));
  const tb = el("tbody");
  rateRows.forEach(([key,val])=>{
    const parts = key.split("|");
    const label = `${parts[0]} · ${parts[1]}gsm` + (parts[2]? ` · ${parts[2]}cm` : " · "+t("anyWidth"));
    const inp = inputEl("number","","",{value:val, style:"width:80px;"});
    tb.appendChild(el("tr",{},[
      el("td",{class:"mono"},[label]),
      el("td",{},[inp]),
      el("td",{},[el("button",{class:"btn danger sm", onclick: async ()=>{
        const next = {...state.settings.rates}; delete next[key]; await saveSettings({rates: next}); }},["✕"])]),
    ]));
    inp.addEventListener("change", async ()=>{
      const next = {...state.settings.rates, [key]: Number(inp.value)||0};
      await saveSettings({rates: next});
    });
  });
  tbl.appendChild(tb);
  rateForm.appendChild(tbl);

  const addRow = el("div",{class:"form-grid", style:"margin-top:12px;"});
  const typeSel = selectEl("newType", PRODUCT_TYPES.map(p=>({value:p,label:p})));
  const gsmInp = inputEl("number","newGsm","GSM");
  const widthInp = inputEl("number","newWidth","Width (optional)");
  const rateInp = inputEl("number","newRate","kg/h");
  addRow.appendChild(fieldWrap(t("type"), typeSel));
  addRow.appendChild(fieldWrap(t("gsm"), gsmInp));
  addRow.appendChild(fieldWrap(t("widthOptCm"), widthInp));
  addRow.appendChild(fieldWrap(t("colKgH"), rateInp));
  const addBtn = el("button",{class:"btn sm"},[t("addBenchmark")]);
  addRow.appendChild(el("div",{},[addBtn]));
  addBtn.addEventListener("click", async (e)=>{
    e.preventDefault();
    if(!gsmInp.value || !rateInp.value) return;
    const key = widthInp.value ? `${typeSel.value}|${gsmInp.value}|${widthInp.value}` : `${typeSel.value}|${gsmInp.value}`;
    const next = {...state.settings.rates, [key]: Number(rateInp.value)};
    await saveSettings({rates: next});
  });
  rateForm.appendChild(addRow);
  rightCard.appendChild(rateForm);

  // Company-wide shift/line setup and rate benchmarks are admin-only to edit
  // (PUT /api/settings is admin-only server-side too) — everyone else just
  // doesn't see these two editing cards; the numbers they feed (capacity,
  // rateFor, etc.) still apply to everyone.
  if(state.isOwner){
    wrap.appendChild(leftCard);
    wrap.appendChild(rightCard);
  }
  wrap.appendChild(buildLanguageCard());
  wrap.appendChild(buildTabVisibilityCard());
  const selfCard = buildSelfVisibilityCard();
  if(selfCard) wrap.appendChild(selfCard);
  wrap.appendChild(buildCustomerVisibilityCard());
  wrap.appendChild(buildDataMaintenanceCard());
  const usersCard = buildUsersAdminCard();
  if(usersCard) wrap.appendChild(usersCard);
  const exportCard = buildDataExportCard();
  if(exportCard) wrap.appendChild(exportCard);
  return wrap;
}

/* Recomputes actualHours for every logged run from its own start/end clock times
   (handling an evening shift that crosses midnight) and fixes any run whose stored
   hours doesn't match — a one-click sweep for stray typos or old bad entries. */
function buildDataMaintenanceCard(){
  const card = el("div",{class:"card", style:"grid-column:1/-1;"});
  card.appendChild(el("div",{class:"card-head"},[
    el("h2",{},[t("dataMaintTitle")]),
    el("span",{class:"hint"},[t("dataMaintHint")])
  ]));
  const btn = el("button",{class:"btn sm"},[t("recalcHoursBtn")]);
  card.appendChild(btn);
  btn.addEventListener("click", async ()=>{
    btn.disabled = true;
    let fixed = 0;
    const updates = [];
    state.logs.forEach(l=>{
      if(!l.startTime || !l.endTime) return;
      const h = hoursBetween(l.startTime, l.endTime);
      if(h==null) return;
      const rounded = Math.round(h*100)/100;
      if(Math.abs(rounded - (Number(l.actualHours)||0)) > 0.01){
        fixed++;
        updates.push(updateDoc("logs", l.id, {actualHours: rounded}));
      }
    });
    await Promise.all(updates);
    btn.disabled = false;
    showToast(t("recalcHoursDone",{n:fixed}));
  });
  return card;
}

/* Lets an admin pull every live record out as one JSON file — a plain backup/
   migration download now, admin-only same as the rest of this app's admin
   surfaces (state.isOwner is just role==="admin", see the state object above). */
function buildDataExportCard(){
  if(!state.isOwner) return null;
  const card = el("div",{class:"card", style:"grid-column:1/-1;"});
  card.appendChild(el("div",{class:"card-head"},[
    el("h2",{},[t("dataExportTitle")]),
    el("span",{class:"hint"},[t("dataExportHint")])
  ]));
  const btn = el("button",{class:"btn sm"},[t("exportAllDataBtn")]);
  card.appendChild(btn);
  btn.addEventListener("click", exportAllData);
  return card;
}

/* Gathers every collection this app keeps (plus settings) into one JSON file and
   triggers a direct browser download of it (see downloadFile above). Each record
   keeps its own database id, additionally as "legacyId", so a future import script
   has an unambiguous field to key off. */
function exportAllData(){
  const withLegacyId = (list)=> (list||[]).map(r=>({...r, legacyId: r.id}));
  const payload = {
    orders: withLegacyId(state.orders),
    schedule: withLegacyId(state.schedule),
    logs: withLegacyId(state.logs),
    deliverySlips: withLegacyId(state.deliverySlips),
    settings: state.settings,
    exportedAt: new Date().toISOString(),
  };
  downloadFile(`fillco-export-${todayStr()}.json`, JSON.stringify(payload, null, 2), "application/json");
}

function buildLanguageCard(){
  const card = el("div",{class:"card", style:"grid-column:1/-1;"});
  card.appendChild(el("div",{class:"card-head"},[
    el("h2",{},[t("languageTitle")]),
    el("span",{class:"hint"},[t("languageHint")])
  ]));
  const row = el("div",{class:"row-flex"});
  row.appendChild(el("button",{class: state.lang==="en" ? "btn sm" : "btn ghost sm", onclick:()=>setLang("en")},[t("english")]));
  row.appendChild(el("button",{class: state.lang==="ar" ? "btn sm" : "btn ghost sm", onclick:()=>setLang("ar")},[t("arabic")]));
  card.appendChild(row);
  return card;
}

/* Which tabs show in THIS person's tab bar, on this device — everyone can tailor it to
   their own role without needing an admin or org identity. */
function buildTabVisibilityCard(){
  const card = el("div",{class:"card", style:"grid-column:1/-1;"});
  card.appendChild(el("div",{class:"card-head"},[
    el("h2",{},[t("tabVisTitle")]),
    el("span",{class:"hint"},[t("tabVisHint")])
  ]));
  const hidden = new Set(getHiddenTabs());
  const list = el("div",{class:"row-flex"});
  HIDEABLE_TABS.forEach(v=>{
    const chk = el("input",{type:"checkbox"});
    if(!hidden.has(v)) chk.setAttribute("checked","checked");
    const lbl = el("label",{style:"flex-direction:row; align-items:center; gap:6px; font-weight:600; background:var(--surface-2); padding:6px 10px; border-radius:7px;"},[
      chk, document.createTextNode(t(TAB_LABEL_KEYS[v]))
    ]);
    chk.addEventListener("change", ()=>{
      const next = new Set(getHiddenTabs());
      if(chk.checked) next.delete(v); else next.add(v);
      setHiddenTabs([...next]);
      applyTabVisibility();
      render();
    });
    list.appendChild(lbl);
  });
  card.appendChild(list);
  return card;
}

/* Self-service: lets ANY viewer hide customer names for themselves, on this
   browser/device, with no dependency on org search or org identity at all.
   This is the reliable fallback: it works even for an editor invited from
   OUTSIDE the organization, who the "user" capability can't resolve an id
   for (so they never appear in search, and the earlier id-based self-toggle
   never showed up for them either). */
function buildSelfVisibilityCard(){
  if(state.isOwner) return null;
  const card = el("div",{class:"card", style:"grid-column:1/-1;"});
  card.appendChild(el("div",{class:"card-head"},[
    el("h2",{},[t("yourCustVis")]),
    el("span",{class:"hint"},[t("yourCustVisHint")])
  ]));

  const isRestricted = getLocalHideCustomer();

  const statusRow = el("div",{class:"cap-row", style:"grid-template-columns:1fr auto;"});
  const who = el("div",{class:"who"});
  const nameEl = el("span",{}); nameEl.textContent = state.viewerName || t("youThisDevice");
  const subEl = el("span",{class:"sub"});
  subEl.textContent = isRestricted ? t("custHiddenForYou") : t("custVisibleForYou");
  who.appendChild(nameEl); who.appendChild(subEl);
  statusRow.appendChild(who);

  const toggleBtn = el("button",{class: isRestricted ? "btn sm" : "btn danger sm", onclick: ()=>{
    setLocalHideCustomer(!isRestricted);
    recomputeCustomerVisibility();
    render();
  }},[isRestricted ? t("showCustForMe") : t("hideCustForMe")]);
  statusRow.appendChild(toggleBtn);
  card.appendChild(statusRow);

  return card;
}

/* Restrict specific team accounts (by their numeric /api/users id, not access tier —
   they can still edit everything else) from seeing customer names anywhere in the
   app. Used to search Claude.ai's org identity (userCap.search); now searches this
   server's own user list (state.users, loaded admin-side by fetchAll/refetchForView). */
function buildCustomerVisibilityCard(){
  const card = el("div",{class:"card", style:"grid-column:1/-1;"});
  card.appendChild(el("div",{class:"card-head"},[
    el("h2",{},[t("custVisTitle")]),
    el("span",{class:"hint"},[t("custVisHint")])
  ]));

  const restricted = state.settings.restrictedViewers||[];
  if(!restricted.length){
    card.appendChild(el("div",{class:"empty"},[t("noOneRestricted")]));
  } else {
    const list = el("div");
    restricted.forEach(v=>{
      const row = [el("div",{class:"who"},[v.name || t("unnamed")])];
      if(state.isOwner){
        row.push(el("button",{class:"btn danger sm", onclick: async ()=>{
          const next = restricted.filter(x=>x.id!==v.id);
          await saveSettings({restrictedViewers: next});
        }},[t("remove")]));
      }
      list.appendChild(el("div",{class:"cap-row", style:"grid-template-columns:1fr auto;"},row));
    });
    card.appendChild(list);
  }

  if(!state.isOwner) return card; // only an admin can search/add/remove — everyone else just sees the list above

  const searchWrap = el("div",{style:"margin-top:12px; position:relative;"});
  const searchInp = inputEl("text","",t("searchPlaceholder"));
  searchWrap.appendChild(searchInp);
  const results = el("div",{style:"margin-top:6px;"});
  searchWrap.appendChild(results);
  card.appendChild(searchWrap);

  searchInp.addEventListener("input", ()=>{
    const q = searchInp.value.trim().toLowerCase();
    results.innerHTML = "";
    const hits = !q ? [] : (state.users||[]).filter(u=>
      (u.username||"").toLowerCase().includes(q) || (u.displayName||"").toLowerCase().includes(q)
    );
    if(!hits.length){
      if(q) results.appendChild(el("div",{class:"hint"},[t("noMatches")]));
      return;
    }
    hits.forEach(p=>{
      if((state.settings.restrictedViewers||[]).some(v=>v.id===p.id)) return; // already restricted
      const row = el("div",{class:"cap-row", style:"grid-template-columns:1fr auto;"});
      const who = el("div",{class:"who"});
      const nameEl = el("span",{}); nameEl.textContent = p.displayName || p.username || "";
      const subEl = el("span",{class:"sub"}); subEl.textContent = "@"+(p.username||"");
      who.appendChild(nameEl); who.appendChild(subEl);
      row.appendChild(who);
      row.appendChild(el("button",{class:"btn sm", onclick: async ()=>{
        const next = [...(state.settings.restrictedViewers||[]), {id:p.id, name:p.displayName||p.username||""}];
        await saveSettings({restrictedViewers: next});
        searchInp.value = ""; results.innerHTML = "";
      }},[t("restrict")]));
      results.appendChild(row);
    });
  });

  return card;
}

/* Minimal admin screen for onboarding/managing team accounts — the new thing this
   self-hosted version needs that the original Artifact app never did, since Claude
   handled identity there. Admin-only (both here and server-side: /api/users is
   requireAdmin). Deliberately simple: a list with role/active toggles and a
   password-reset field, plus a small "add account" form — not a full user-admin
   console. */
function buildUsersAdminCard(){
  if(!state.isOwner) return null;
  const card = el("div",{class:"card", style:"grid-column:1/-1;"});
  card.appendChild(el("div",{class:"card-head"},[
    el("h2",{},[t("usersTitle")]),
    el("span",{class:"hint"},[t("usersHint")])
  ]));

  const users = state.users||[];
  if(!users.length){
    card.appendChild(el("div",{class:"empty"},[t("usersNone")]));
  } else {
    const tw = el("div",{class:"table-wrap"});
    const tbl = el("table");
    tbl.appendChild(el("thead",{},[el("tr",{},[t("username"),t("displayNameLabel"),t("roleLabel"),t("activeLabel"),t("newPasswordLabel"),""].map(h=>el("th",{},[h])))]));
    const tb = el("tbody");
    users.forEach(u=>{
      const nameInp = inputEl("text","","",{value:u.displayName||"", style:"min-width:110px;"});
      const roleSel = selectEl("",[{value:"member",label:t("roleMember")},{value:"admin",label:t("roleAdmin")}], u.role);
      const activeChk = el("input",{type:"checkbox"}); activeChk.checked = !!u.active;
      if(u.id===state.userId){ roleSel.disabled = true; activeChk.disabled = true; } // can't demote/deactivate yourself by mistake
      const passInp = inputEl("password","","",{style:"min-width:110px;"});
      const saveBtn = el("button",{class:"btn sm"},[t("save")]);
      saveBtn.addEventListener("click", async ()=>{
        const patch = {displayName: nameInp.value||u.username, role: roleSel.value, active: activeChk.checked};
        if(passInp.value) patch.password = passInp.value;
        try{
          const row = await apiPatch(`/api/users/${u.id}`, patch);
          mergeIntoState("users", row);
          passInp.value = "";
          showToast(t("saved"));
          render();
        }catch(e){ console.error(e); showToast(t("couldntSave")); }
      });
      tb.appendChild(el("tr",{},[
        el("td",{class:"mono"},[u.username]),
        el("td",{},[nameInp]),
        el("td",{},[roleSel]),
        el("td",{},[activeChk]),
        el("td",{},[passInp]),
        el("td",{},[saveBtn]),
      ]));
    });
    tbl.appendChild(tb); tw.appendChild(tbl); card.appendChild(tw);
  }

  card.appendChild(el("div",{class:"section-title", style:"margin-top:14px;"},[t("newUser")]));
  const form = el("div",{class:"form-grid"});
  const userInp = inputEl("text","newUsername","");
  const nameInp = inputEl("text","newDisplayName","");
  const passInp = inputEl("password","newUserPassword","");
  const roleSel = selectEl("newUserRole",[{value:"member",label:t("roleMember")},{value:"admin",label:t("roleAdmin")}]);
  form.appendChild(fieldWrap(t("username"), userInp));
  form.appendChild(fieldWrap(t("displayNameLabel"), nameInp));
  form.appendChild(fieldWrap(t("password"), passInp));
  form.appendChild(fieldWrap(t("roleLabel"), roleSel));
  const addBtn = el("button",{class:"btn sm"},[t("addUserBtn")]);
  form.appendChild(el("div",{},[addBtn]));
  card.appendChild(form);
  addBtn.addEventListener("click", async (e)=>{
    e.preventDefault();
    if(!userInp.value.trim() || !passInp.value){ showToast(t("usernamePasswordRequired")); return; }
    try{
      const row = await apiPost("/api/users", {
        username: userInp.value.trim(), password: passInp.value,
        displayName: nameInp.value.trim()||userInp.value.trim(), role: roleSel.value,
      });
      mergeIntoState("users", row);
      userInp.value = ""; nameInp.value = ""; passInp.value = ""; roleSel.value = "member";
      render();
    }catch(e){ console.error(e); showToast(t("usernameTaken")); }
  });

  return card;
}

/* ---- form helpers ---- */
function fieldWrap(labelText, inputElm){
  return el("label",{},[labelText, inputElm]);
}
function inputEl(type,name,placeholder,extra){
  const i = el("input",{type,name,placeholder:placeholder||""});
  if(extra) for(const k in extra) i.setAttribute(k, extra[k]);
  return i;
}
function selectEl(name, options, selected){
  const s = el("select",{name});
  options.forEach(o=>{
    const opt = el("option",{value:o.value},[o.label]);
    if(selected!=null && String(selected)===String(o.value)) opt.setAttribute("selected","selected");
    s.appendChild(opt);
  });
  return s;
}

/* ---- tabs ----
   Switching tabs re-renders immediately with whatever's already loaded, then
   kicks off a cheap background refetch of that tab's own data (see
   refetchForView) — no live push channel in this self-hosted version, so
   this is what keeps things reasonably fresh without pulling everything
   on every click. */
document.getElementById("tabs").addEventListener("click",(e)=>{
  const btn = e.target.closest(".tab");
  if(!btn) return;
  state.view = btn.dataset.view;
  render();
  refetchForView(state.view);
});

/* ---- boot ---- */
boot();
</script>
