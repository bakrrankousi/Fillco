name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: fillco
          POSTGRES_PASSWORD: fillco
          POSTGRES_DB: fillco_dev
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U fillco" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://fillco:fillco@localhost:5432/fillco_dev
      TEST_DATABASE_URL: postgresql://fillco:fillco@localhost:5432/fillco_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Create test database
        run: psql postgresql://fillco:fillco@localhost:5432/fillco_dev -c 'CREATE DATABASE fillco_test'
      - run: pnpm format:check
      - run: pnpm build
      - run: pnpm lint
      - run: pnpm typecheck
      - name: Migrations are in sync with the schema
        working-directory: packages/db
        run: |
          npx prisma migrate deploy
          npx prisma migrate diff --from-url "$DATABASE_URL" --to-schema-datamodel prisma/schema.prisma --exit-code
      - name: Unit and integration tests
        run: pnpm test
      - name: Demo seed and database integrity
        run: |
          pnpm --filter @fillco/api seed:demo
          pnpm db:check
      - name: End-to-end tests
        run: |
          pnpm --filter @fillco/e2e exec playwright install --with-deps chromium
          pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: e2e/playwright-report
          retention-days: 7
